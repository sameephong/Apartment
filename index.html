<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f2f4f7">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ดูแลตึก"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>ระบบบริหารอพาร์ทเม้นท์</title>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=5.9.2">
<script>document.write('<script src="config.js?t=' + Date.now() + '"><\/script>')</script>
<script src="common.js?v=5.9.2"></script>
<style>
.choice{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px;text-decoration:none;color:inherit}
.choice:hover{border-color:#9aa3ad}
.choice .ic{width:56px;height:56px;font-size:28px;border-radius:16px}
.choice b{display:block;font-size:19px}
</style>
</head>
<body>
<div class="wrap" style="display:flex;flex-direction:column">
  <div id="demo"></div>
  <div class="bd" style="flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:40px">
    <div style="text-align:center;margin-bottom:22px"><div style="font-size:44px">🏢</div><b style="font-size:24px" id="n">ระบบบริหารอพาร์ทเม้นท์</b><div class="muted">เลือกการเข้าใช้งาน</div></div>
    <div id="pick" class="card hide"><b style="font-size:18px">เลือกตึก</b><div class="muted small">แตะลูกศรเพื่อเลือกตึกของคุณ</div>
      <label class="f" style="margin-top:10px"><select id="bSel" onchange="pickB()" style="font-size:19px;font-weight:700;padding:12px"><option value="">— เลือกตึก —</option></select></label>
      <p class="muted small" id="bErr" style="text-align:center;margin:0"></p></div>
    <div id="choices">
    <a class="choice" id="cTen" href="tenant.html"><i class="ic" style="background:var(--t-soft)">🏠</i><div><b>ผู้เช่า</b><span class="muted">ดูบิล สแกนจ่าย ส่งสลิป แจ้งซ่อม</span></div></a>
    <a class="choice" href="admin.html"><i class="ic" style="background:var(--o-soft)">🔑</i><div><b>เจ้าของหอ</b><span class="muted">ห้อง มิเตอร์ ออกบิล รับเงิน งานซ่อม</span></div></a>
    </div>
    <p class="muted small" style="text-align:center" id="bldLine"></p>
    <button class="btn blk install-btn hide" style="margin-top:6px" onclick="installApp()">📲 ติดตั้งแอป “ดูแลตึก” ลงเครื่อง</button>
    <div id="hint"></div>
  </div>
</div>
<script>
document.getElementById('demo').innerHTML = demoBanner();
if (IS_DEMO) document.getElementById('hint').innerHTML = `<div class="card" style="background:#fffbea;border-color:#f1e3a0"><b>ลองใช้งานได้เลย</b><div class="muted small" style="margin-top:4px">
  เจ้าของหอ: รหัสผ่าน <b>1234</b><br>ผู้เช่า: ห้อง <b>101</b> รหัส <b>111111</b> · ห้อง <b>102</b> รหัส <b>222222</b><br>
  มีข้อมูลตัวอย่าง 24 ห้อง บิล 3 เดือน สลิปรออนุมัติ และงานซ่อม · ข้อมูลอยู่ในเบราว์เซอร์นี้เท่านั้น</div></div>`;
function $id(i) { return document.getElementById(i); }
function pickB() {
  const c = $id('bSel').value;
  if (!c || !BLD_LIST[c]) return;
  try { localStorage.setItem('apt_bld', c); } catch (e) {}
  const next = new URLSearchParams(location.search).get('next');
  location.href = next && /^(admin|tenant|bill)\.html/.test(next) ? next : 'index.html';
}
// ระบบผู้เช่าปิด → ซ่อนปุ่ม "ผู้เช่า"
function tenantBtn(app) { $id('cTen').classList.toggle('hide', app === false); }
if (NEED_BLD) {
  $id('pick').classList.remove('hide'); $id('choices').classList.add('hide');
  document.querySelector('.muted').textContent = 'เลือกตึกของคุณ';
  const codes = Object.keys(BLD_LIST);
  const fill = () => { const v = $id('bSel').value; $id('bSel').innerHTML = '<option value="">— เลือกตึก —</option>' + codes.map(c => `<option value="${esc(c)}">${esc(bLabel(c))}</option>`).sort((a, b) => a.localeCompare(b, 'th')).join(''); $id('bSel').value = v; };
  fill(); setTimeout(() => { $id('bSel').value = ''; }, 50); // ไม่เลือกตึกเดิมให้
  codes.forEach(c => fetchBInfo(c).then(j => { if (j) fill(); })); // อัปเดตชื่อตึกล่าสุดที่เจ้าของตั้งไว้
} else {
  // เปิดจากไอคอนแอป: เคยเข้าระบบไว้ → ไปหน้านั้นเลย
  if (new URLSearchParams(location.search).get('source') === 'app') { if (load('owner_pw')) location.replace('admin.html'); else if (load('tenant_auth')) location.replace('tenant.html'); }
  const c = bInfo(BLD && BLD.code); if (c) { tenantBtn(c.app); if (c.name) $id('n').textContent = c.name; }
  if (BLD_MANY) $id('bldLine').innerHTML = `🏢 <b>${esc(bLabel(BLD.code))}</b> · <a href="#" onclick="changeBuilding();return false">เปลี่ยนตึก</a>`;
  callApi('publicInfo').then(i => { bInfo(BLD && BLD.code, i); $id('n').textContent = i.apartmentName; document.title = i.apartmentName; tenantBtn(!(i.flags && i.flags.app === false)); if (BLD_MANY) $id('bldLine').querySelector('b').textContent = i.buildingName || i.apartmentName; }).catch(() => {});
}
</script>
</body>
</html>
