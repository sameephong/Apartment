<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2457c5">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ดูแลตึก"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>เจ้าของหอ · ระบบบริหารอพาร์ทเม้นท์</title>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=4.5">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>document.write('<script src="config.js?t=' + Date.now() + '"><\/script>')</script>
<script src="common.js?v=4.4"></script>
</head>
<body class="admin">
<div class="wrap">
  <div id="login" class="bd" style="padding-top:12vh">
    <div class="card pp-card">
      <div class="row" style="flex-wrap:nowrap;gap:14px;margin-bottom:14px"><img src="icon-192.png" alt="" style="width:62px;height:62px;border-radius:16px;flex:none"><div style="min-width:0"><b style="font-size:22px">ดูแลตึก</b><div class="muted small">เข้าสู่ระบบเจ้าของหอ</div><div class="muted small" id="bldLine"></div></div></div>
      <div id="pwPad"></div>
      <div id="pwText" class="hide"><label class="f">รหัสผ่าน<input id="pw" type="password" autocomplete="current-password" style="font-size:18px"></label><button class="btn pri blk lg login-go" onclick="doLogin()">เข้าสู่ระบบ</button></div>
      <p class="muted" id="loginErr" style="color:var(--bad);text-align:center;min-height:1em;margin:10px 0 4px"></p>
      <p class="muted small" style="text-align:center;margin:0"><a href="#" id="pwSwitch" onclick="pwSwitch();return false">รหัสมีตัวอักษร? ใช้แป้นพิมพ์</a></p>
      <p class="muted small" id="demoHint" style="text-align:center"></p>
    </div>
    <button class="btn blk install-btn hide" onclick="installApp()">📲 ติดตั้งแอป “ดูแลตึก” ลงเครื่อง</button>
    <p class="muted" style="text-align:center"><span id="tenLink"><a href="tenant.html">สำหรับผู้เช่า</a> · </span><a href="index.html">หน้าแรก</a></p>
  </div>
  <div id="app" class="hide">
    <aside class="side" id="side"></aside>
    <div id="demo"></div>
    <div class="hd" id="hd"></div>
    <div class="bd" id="view"></div>
    <div class="nav" id="nav"></div>
  </div>
</div>
<div class="sheet-bg" id="sbg" onclick="if(event.target===this)closeSheet()"><div class="sheet"><button class="x" onclick="closeSheet()">×</button><div id="sbody"></div></div></div>
<div id="toast"></div>
<div id="loading"><div>กำลังบันทึก…</div></div>

<script>
let PW = '', D = null, ROUTE = ['home'], UI = { billSeg: 'todo', billMonth: '', repSeg: 'open', meterUtil: 'both', showLeft: false, reportMonth: '' };
const IMG = {};
const $ = s => document.querySelector(s);
const q = s => esc(JSON.stringify(String(s)));

/* ================= พื้นฐาน ================= */
function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3000); }
function openSheet(h) { $('#sbody').innerHTML = h; $('#sbg').classList.add('on'); }
function closeSheet() { $('#sbg').classList.remove('on'); }
function today() { return D.serverToday; }
function curMonth() { return today().slice(0, 7); }
function S() { return D.settings; }
function FL() { return Object.assign({ mode: 'shared', app: true, slip: true, repair: true, news: true, billLink: true }, (D && D.settings && D.settings.flags) || {}); }
const OWN = () => FL().mode === 'owner';
const repOpen = r => r.status === 'รอดำเนินการ' || r.status === 'กำลังซ่อม';
const DESK = () => window.matchMedia('(min-width:1024px)').matches;
async function api(action, payload, quiet) {
  if (!quiet) $('#loading').style.display = 'flex';
  try { const j = await callApi(action, Object.assign({ password: PW }, payload || {})); if (j.data) { D = j.data; cacheData('owner_cache', D); } return j; }
  finally { $('#loading').style.display = 'none'; }
}
async function act(action, payload, msg) {
  try { const j = await api(action, payload); if (msg) toast(msg); return j; }
  catch (e) { uiAlert(e.message); throw e; }
}
function go(h) { if (location.hash === '#' + h) render(); else location.hash = h; }
window.addEventListener('hashchange', () => { closeSheet(); render(); window.scrollTo(0, 0); });
function openLine(text) { const a = document.createElement('a'); a.href = 'https://line.me/R/share?text=' + encodeURIComponent(text); a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }
function tenantUrl(room) { return new URL(withB('tenant.html' + (room ? '?room=' + encodeURIComponent(room) : '')), location.href).href; }

/* ================= ข้อมูล ================= */
const active = () => D.tenants.filter(t => t.status === 'อยู่');
const tenantOf = room => D.tenants.find(t => t.room === room && t.status === 'อยู่');
const tenantById = id => D.tenants.find(t => t.id === id);
const billById = id => D.bills.find(b => b.id === id);
function advLeft(t) { const used = D.bills.filter(b => b.tenantId === t.id).reduce((a, b) => a + (b.items || []).filter(i => i.k === 'advuse').reduce((x, i) => x - (+i.a || 0), 0), 0); return Math.max(0, (+t.advanceRent || 0) - used); }
const isOverdue = b => b.status === 'รอชำระ' && b.dueDate < today();
const openBills = () => D.bills.filter(b => b.status !== 'ชำระแล้ว');
function statusBadge(b) {
  if (b.status === 'ชำระแล้ว') return '<span class="badge b-ok">ชำระแล้ว</span>';
  if (b.status === 'รออนุมัติ') return '<span class="badge b-o">สลิปรออนุมัติ</span>';
  if (isOverdue(b)) return `<span class="badge b-bad">เกินกำหนด ${daysBetween(b.dueDate, today())} วัน</span>`;
  return '<span class="badge b-warn">รอชำระ</span>';
}
function latestMonthly() { const m = D.bills.filter(b => b.kind === 'รายเดือน').map(b => b.month).sort(); return m[m.length - 1]; }
function prevReading(room, month) {
  const rec = D.meters.find(m => m.month === month && m.room === room);
  const earlier = D.meters.filter(m => m.room === room && m.month < month).sort((a, b) => b.month.localeCompare(a.month));
  const pick = k => { if (rec && rec[k + 'Prev'] !== '') return rec[k + 'Prev']; for (const m of earlier) { if (m[k + 'Cur'] !== '') return m[k + 'Cur']; if (m[k + 'Prev'] !== '') return m[k + 'Prev']; } return ''; };
  return { water: pick('water'), elec: pick('elec') };
}
function meterRooms(month) { return active().filter(t => t.startDate.slice(0, 7) <= month).sort((a, b) => a.room.localeCompare(b.room, undefined, { numeric: true })); }
function meterDone(month) { return meterRooms(month).filter(t => { const r = D.meters.find(m => m.month === month && m.room === t.room); return r && r.waterCur !== '' && r.elecCur !== ''; }).length; }
function badgeCounts() {
  return { bills: D.bills.filter(b => b.status === 'รออนุมัติ' || isOverdue(b)).length, repairs: D.repairs.filter(r => r.status === 'รอดำเนินการ').length };
}

/* ================= เข้าสู่ระบบ ================= */
async function doLogin() {
  PW = $('#pw').value; if (!PW) return;
  const btns = document.querySelectorAll('#loginBtn, .login-go'); $('#loginErr').textContent = '';
  btns.forEach(b => { b.disabled = true; b.dataset.l = b.dataset.l || b.textContent; b.textContent = '…'; });
  try { await api('login', {}, true); store('owner_pw', PW); start(); }
  catch (e) { $('#loginErr').textContent = e.message; if (PAD) PAD.shake(); $('#pw').value = ''; }
  btns.forEach(b => { b.disabled = false; b.textContent = b.dataset.l; });
}
function logout() { store('owner_pw'); store('owner_cache'); location.href = 'admin.html'; }
function start() { $('#login').classList.add('hide'); $('#app').classList.remove('hide'); $('#demo').innerHTML = demoBanner(FL().app ? '<a href="tenant.html">ลองฝั่งผู้เช่า</a>' : ''); render(); }
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
// แป้นตัวเลขบนจอ (ค่าเริ่มต้น) · ถ้ารหัสมีตัวอักษร สลับไปใช้แป้นพิมพ์ปกติได้ (จำไว้ในเครื่อง)
const PAD = pinPad($('#pwPad'), { goId: 'loginBtn', onChange: v => { $('#pw').value = v; }, onSubmit: () => doLogin() });
function pwSwitch(force) {
  const text = force != null ? force : $('#pwText').classList.contains('hide');
  $('#pwText').classList.toggle('hide', !text); $('#pwPad').classList.toggle('hide', text);
  $('#pwSwitch').textContent = text ? 'ใช้แป้นตัวเลข' : 'รหัสมีตัวอักษร? ใช้แป้นพิมพ์';
  $('#pw').value = ''; PAD.clear(); try { localStorage.setItem('pw_kb', text ? 'text' : 'pad'); } catch (e) {}
  if (text) { kbFix($('#pw')); }
}
try { if (localStorage.getItem('pw_kb') === 'text') pwSwitch(true); } catch (e) {}
(async () => {
  await new Promise(r => setTimeout(r)); // รอให้สคริปต์ทั้งหน้าโหลดเสร็จก่อน
  if (IS_DEMO) $('#demoHint').innerHTML = 'โหมดทดลอง: รหัสผ่าน <b>1234</b>';
  if (BLD_MANY && BLD) $('#bldLine').innerHTML = `🏢 <b>${esc(bLabel(BLD.code))}</b> · <a href="#" onclick="changeBuilding();return false">เปลี่ยนตึก</a>`;
  const bi = bInfo(BLD && BLD.code); if (bi && !bi.app) $('#tenLink').classList.add('hide');
  const saved = load('owner_pw');
  if (!saved) { // ปลุกเซิร์ฟเวอร์ไว้ระหว่างพิมพ์รหัส + อัปเดตชื่อตึก/สถานะระบบผู้เช่า
    callApi('publicInfo').then(i => { bInfo(BLD && BLD.code, i); $('#tenLink').classList.toggle('hide', !!(i.flags && i.flags.app === false)); const b = $('#bldLine b'); if (b) b.textContent = i.buildingName || i.apartmentName; }).catch(() => {});
    return;
  }
  PW = saved;
  const cached = loadData('owner_cache');
  if (cached && cached.settings) { D = cached; start(); } // เปิดหน้าทันทีจากข้อมูลที่จำไว้
  syncBadge(true);
  try { await api('getAll', {}, true); if (cached && cached.settings) render(); else start(); }
  catch (e) { if (/รหัสผ่าน/.test(e.message)) { store('owner_pw'); store('owner_cache'); location.reload(); } else if (!cached) $('#loginErr').textContent = e.message; }
  syncBadge(false);
})();
async function refresh() { syncBadge(true); try { await api('getAll', {}, true); if (!$('#sbg').classList.contains('on')) render(); } catch (e) {} syncBadge(false); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && D && !$('#sbg').classList.contains('on') && ROUTE[0] !== 'meters') refresh(); });

/* ================= Render ================= */
const VIEWS = {};
function render() {
  if (!D) return;
  ROUTE = (location.hash.slice(1) || 'home').split('/').map(decodeURIComponent);
  const desk = DESK(), v = (VIEWS[ROUTE[0]] || VIEWS.home)(...ROUTE.slice(1));
  $('#hd').innerHTML = (v.back ? `<button class="back" onclick="history.length>1?history.back():go('${v.back}')">‹</button>` : '') +
    `<div class="tt"><b>${v.title}</b>${v.sub ? `<span>${v.sub}</span>` : ''}</div>` + (desk ? (v.dright != null ? v.dright : (v.right || '')) + deskTools() : (v.right || ''));
  $('#view').innerHTML = desk && !v.wide ? `<div class="narrow">${v.html}</div>` : v.html;
  if (desk) renderSide(v);
  const nav = v.nav || ROUTE[0], c = badgeCounts();
  $('#nav').innerHTML = [['home', '🏠', 'ภาพรวม'], ['rooms', '🚪', 'ห้อง'], ['bills', '💰', 'บิล/เงิน', c.bills], ['repairs', '🔧', 'แจ้งซ่อม', c.repairs], ['more', '☰', 'เพิ่มเติม']]
    .map(([k, i, l, n]) => `<button class="${k === nav ? 'on' : ''}" onclick="go('${k}')"><i>${i}</i>${l}${n ? `<span class="n">${n}</span>` : ''}</button>`).join('');
  document.title = v.title + ' · ' + S().apartmentName;
  if (v.after) v.after();
}

/* ---------- O1 ภาพรวม ---------- */
VIEWS.home = () => {
  const s = S(), rooms = D.rooms, occ = rooms.filter(r => r.status === 'มีผู้เช่า').length;
  if (!rooms.length) return { title: s.apartmentName, sub: fmtDayLong(today()), html: `<div class="card"><h4>เริ่มต้นใช้งาน 👋</h4><p>1. ตั้งชื่อหอ ค่าน้ำ ค่าไฟ พร้อมเพย์<br>2. สร้างห้องทีละหลายห้อง<br>3. เช็คอินผู้เช่าแต่ละห้อง</p><button class="btn pri blk" onclick="go('settings')">ไปที่ตั้งค่า</button></div>` };
  const lm = latestMonthly(), mb = D.bills.filter(b => b.kind === 'รายเดือน' && b.month === lm);
  const billed = mb.reduce((a, b) => a + +b.total, 0), got = mb.filter(b => b.status === 'ชำระแล้ว').reduce((a, b) => a + +b.paidAmount, 0);
  const review = D.bills.filter(b => b.status === 'รออนุมัติ'), over = D.bills.filter(isOverdue);
  const reps = D.repairs.filter(repOpen), newReps = reps.filter(r => r.status === 'รอดำเนินการ');
  const exp = active().filter(t => t.endDate && daysBetween(today(), t.endDate) <= 45).sort((a, b) => a.endDate.localeCompare(b.endDate));
  const cm = curMonth(), need = meterRooms(cm).length, done = meterDone(cm), issued = D.bills.some(b => b.kind === 'รายเดือน' && b.month === cm);
  const todo = [];
  if (review.length) todo.push(['🧾', 'var(--o-soft)', 'อนุมัติสลิป', 'ผู้เช่าส่งสลิปมา ' + review.map(b => b.room).slice(0, 6).join(', '), review.length, `<button class="btn sm pri">ตรวจ</button>`, 'approve']);
  const dueOk = D.bills.filter(b => b.status === 'รอชำระ' && !isOverdue(b));
  if (OWN() && dueOk.length) todo.push(['💵', 'var(--warn-soft)', 'รอรับเงิน', 'ห้อง ' + [...new Set(dueOk.map(b => b.room))].slice(0, 8).join(', '), dueOk.length, '<button class="btn sm pri">บันทึกรับเงิน</button>', 'bills']);
  if (over.length) todo.push(['⏰', 'var(--bad-soft)', 'บิลเกินกำหนด', 'ห้อง ' + [...new Set(over.map(b => b.room))].join(', '), over.length, '<button class="btn sm">ดู</button>', 'bills']);
  if (reps.length) todo.push(['🔧', 'var(--warn-soft)', newReps.length ? 'งานแจ้งซ่อมใหม่' : 'งานซ่อมยังไม่เสร็จ', reps.slice(0, 3).map(r => r.category + ' ' + r.room).join(' · '), reps.length, '<button class="btn sm">ดู</button>', 'repairs']);
  if (exp.length) todo.push(['📄', 'var(--purple-soft)', 'สัญญาใกล้หมด', exp.slice(0, 3).map(t => t.room + (daysBetween(today(), t.endDate) < 0 ? ' (หมดแล้ว)' : ' · อีก ' + daysBetween(today(), t.endDate) + ' วัน')).join(', '), exp.length, '<button class="btn sm">ดู</button>', 'tenants']);
  if (!issued) todo.push(['📊', '#eef0f2', 'จดมิเตอร์ ' + fmtMonthS(cm), done >= need && need ? 'ครบแล้ว พร้อมออกบิล' : 'จดแล้ว ' + done + '/' + need + ' ห้อง · ปกติจดสิ้นเดือน', '', `<button class="btn sm ${done >= need && need ? 'pri' : ''}">${done >= need && need ? 'ออกบิล' : 'จด'}</button>`, done >= need && need ? 'issue/' + cm : 'meters']);
  return {
    title: esc(s.apartmentName), sub: fmtDayLong(today()), right: `<button class="pill" onclick="go('profile')">✏️ ข้อมูลหอ</button>`,
    html: `<div class="kpi"><div><span class="muted">ห้องมีผู้เช่า</span><b>${occ}/${rooms.length}</b><span class="muted">ว่าง ${rooms.filter(r => r.status === 'ว่าง').length} ห้อง</span></div>
      <div class="tap" onclick="UI.billMonth='${lm || ''}';UI.billSeg='all';go('bills')"><span class="muted">เก็บเงิน ${lm ? fmtMonthS(lm) : '-'}</span><b style="color:var(--ok)">${money(got)}</b><span class="muted">จาก ${money(billed)}</span></div></div>
      <div class="card"><h4>ต้องทำ</h4>${todo.map(([i, bg, t, d, n, btn, h]) => `<div class="item tap" onclick="go('${h}')"><i class="ic" style="background:${bg}">${i}</i><div style="flex:1;min-width:0"><b>${t}</b><div class="muted small">${esc(d)}</div></div>${n !== '' ? `<b>${n}</b>` : ''}${btn}</div>`).join('') || '<div class="empty">ไม่มีงานค้าง 👍</div>'}</div>`,
  };
};

/* ---------- O2 ผังห้อง ---------- */
VIEWS.rooms = () => {
  const floors = {};
  D.rooms.forEach(r => (floors[r.floor || '-'] = floors[r.floor || '-'] || []).push(r));
  const cls = { 'มีผู้เช่า': 'background:var(--ok-soft);border-color:#bfe3cb', 'จอง': 'background:var(--warn-soft);border-color:#f1d3a7', 'ซ่อม': 'background:var(--bad-soft);border-color:#f2c4c4', 'ซ่อมหนัก': 'background:#4A2C17;border-color:#24140A;color:#fff' };
  return {
    title: 'ผังห้อง', sub: D.rooms.length + ' ห้อง · มีผู้เช่า ' + active().length, right: `<button class="pill" onclick="roomSheet()">+ ห้อง</button>`,
    html: `<div class="row small muted" style="gap:12px;margin-bottom:8px"><span>🟩 มีผู้เช่า</span><span>⬜ ว่าง</span><span>🟧 จอง</span><span>🟥 ซ่อม</span><span>🟫 ซ่อมหนัก</span><span><b style="color:var(--bad)">●</b> ค้างจ่าย</span><span><b style="color:var(--o)">●</b> รออนุมัติ</span></div>
    ${Object.keys(floors).sort((a, b) => a - b).map(f => `<div class="muted small" style="font-weight:700;margin:10px 0 6px">ชั้น ${esc(f)}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:7px">${floors[f].map(r => {
        const t = tenantOf(r.room), ob = openBills().filter(b => b.room === r.room && (!t || b.tenantId === t.id));
        const dot = ob.some(b => b.status === 'รออนุมัติ') ? 'var(--o)' : ob.some(isOverdue) ? 'var(--bad)' : ob.length ? 'var(--warn)' : '';
        return `<div class="tap" onclick="go('room/${encodeURIComponent(r.room)}')" style="position:relative;border:1px solid var(--line);border-radius:11px;padding:7px 8px;background:#fff;min-height:62px;${cls[r.status === 'ซ่อม' && r.fixLevel === 'หนัก' ? 'ซ่อมหนัก' : r.status] || ''}">
          ${dot ? `<span style="position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:${dot}"></span>` : ''}
          <b style="font-size:16px">${esc(r.room)}</b><div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t ? esc(t.name.split(' ')[0]) : esc(r.status)}</div></div>`;
      }).join('')}</div>`).join('') || '<div class="empty">ยังไม่มีห้อง · กด “+ ห้อง” หรือสร้างหลายห้องในเมนูเพิ่มเติม › ตั้งค่า</div>'}`,
  };
};
function roomSheet(no) {
  const r = D.rooms.find(x => x.room === no) || { room: '', floor: '', type: '', rent: '', status: 'ว่าง', note: '' };
  const t = no && tenantOf(no);
  openSheet(`<h3>${no ? 'แก้ไขห้อง ' + esc(no) : 'เพิ่มห้อง'}</h3><div id="fRoom">
    <div class="g2">${no ? '' : '<label class="f">เลขห้อง<input name="room" placeholder="เช่น 101"></label>'}
      <label class="f">ชั้น<input name="floor" type="number" value="${esc(r.floor)}" placeholder="อัตโนมัติ"></label>
      <label class="f">ค่าเช่า/เดือน<input name="rent" type="number" inputmode="numeric" value="${esc(r.rent)}"></label>
      <label class="f">ประเภทห้อง<input name="type" value="${esc(r.type)}" placeholder="เช่น ห้องแอร์"></label></div>

// คำนวณหน่วยที่ใช้ / ค่าน้ำไฟ / เตือนเลขผิดปกติ ของแถวมิเตอร์ (ใช้ทั้งมือถือและคอม)
function mRow(row) {
  let cost = 0, warn = '', filled = 0;
  const ins = [...row.querySelectorAll('input[data-u]')];
  ins.forEach(inp => {
    const u = inp.dataset.u, p = row.dataset['p' + u], c = inp.value, cell = row.querySelector('.u-' + u);
    inp.style.borderColor = ''; inp.style.background = ''; if (cell) cell.style.color = 'var(--muted)';
    if (p === '' || p == null || c === '') { if (cell) cell.textContent = DESK() ? '—' : ''; return; }
    filled++;
    const n = +c - +p;
    if (n < 0) { warn = 'neg'; if (cell) { cell.textContent = 'ติดลบ!'; cell.style.color = 'var(--bad)'; } inp.style.borderColor = 'var(--bad)'; return; }
    cost += utilCost(u, n);
    const avg = avgUnits(row.dataset.room, mMonth(), u), high = avg > 0 && n > Math.max(avg * 2, avg + 30);
    if (high) { warn = warn || 'high'; inp.style.borderColor = 'var(--bad)'; inp.style.background = '#fff7f7'; }
    if (cell) { cell.textContent = DESK() ? n : n + ' หน่วย'; cell.style.color = high ? 'var(--bad)' : DESK() ? 'var(--ink)' : 'var(--muted)'; cell.style.fontWeight = high ? '700' : ''; }
  });
  const cc = row.querySelector('.cost'); if (cc) cc.textContent = filled ? money(cost) + ' ฿' : DESK() ? '—' : '';
  const st = row.querySelector('.st'); if (st) st.innerHTML = warn === 'neg' ? '<span class="pl bad">เลขติดลบ</span>' : warn === 'high' ? '<span class="pl bad">⚠ สูงผิดปกติ</span>' : filled === ins.length && ins.length ? '<span style="color:var(--ok)">✓</span>' : '';
}

async function flushMeters() {

  const pend = mDirty; mDirty = {};

    const el = $('#mSave'); if (el) el.textContent = 'บันทึกแล้ว ✓ ' + new Date().toTimeString().slice(0, 5);
    const c = $('#mCount'), m = mMonth(); if (c && ROUTE[0] === 'meters') { const n = meterRooms(m).length, d = meterDone(m); c.textContent = (DESK() ? 'กรอกแล้ว ' + d + ' / ' : 'จดแล้ว ' + d + '/') + n + ' ห้อง'; const bar = $('#mBar') || (c.parentNode.nextElementSibling || {}).firstElementChild; if (bar) bar.style.width = (n ? d / n * 100 : 0) + '%'; }

}

function getImg(fileId) {
  if (!fileId) return Promise.reject(new Error('ไม่มีรูป'));
  if (!IMG[fileId]) {
    let cached = null; try { cached = sessionStorage.getItem('img_' + fileId); } catch (e) {}
    IMG[fileId] = cached ? Promise.resolve(cached) : api('fileImage', { fileId }, true).then(j => { try { sessionStorage.setItem('img_' + fileId, j.image); } catch (e) {} return j.image; }, e => { delete IMG[fileId]; throw e; });
  }
  return IMG[fileId];
}
async function viewFile(fileId) {

  if (!await uiConfirm('ยืนยันย้ายออก ห้อง ' + t.room + ' ' + t.name + '?')) return;
  const j = await act('moveOut', Object.assign({ id, confirm: true }, formObj('#fMo'))), c = j.calc, b = billById(j.billId);
  go('room/' + t.room);
  const txt = `สรุปการย้ายออก ${S().apartmentName}\nห้อง ${t.room} คุณ${t.name}\n` + c.items.map(i => `${i.l} ${money(i.a)}`).join('\n') + `\n${c.refund ? 'คืนเงินให้ผู้เช่า ' + money(c.refund) : c.owe ? 'ผู้เช่าชำระเพิ่ม ' + money(c.owe) : 'ยอดสุทธิ 0'} บาท\nรายละเอียด: ${billUrl(b)}`;
  setTimeout(() => openSheet(`<div style="text-align:center"><div class="ok-ic">✓</div><h3 style="padding:0">ย้ายออกเรียบร้อย</h3><p class="muted">ห้อง ${esc(t.room)} ว่างแล้ว</p><div class="big" style="color:${c.owe ? 'var(--bad)' : 'var(--ok)'}">${c.refund ? 'คืน ' + money(c.refund) : c.owe ? 'เก็บเพิ่ม ' + money(c.owe) : '0'} บาท</div>${c.refund ? '<p class="muted small">บันทึกไว้ที่หน้า “เงินประกัน” ว่ารอคืนเงิน · กดปุ่มด้านล่างเมื่อโอน/จ่ายคืนแล้ว</p>' : ''}</div>
    ${c.refund ? `<button class="btn blk" style="margin-top:12px" onclick="refundSheet(${q(id)})">💸 บันทึกว่าคืนเงิน ${money(c.refund)} บาทแล้ว</button>` : ''}
    <button class="btn blk" style="margin-top:8px" onclick="docSheet(${q(t.room)},'รูปห้องตอนออก',${q(id)})">📸 แนบรูปห้องตอนย้ายออก</button>
    <button class="btn ok blk lg" style="margin-top:12px" onclick='openLine(${esc(JSON.stringify(txt))})'>ส่งสรุปให้ผู้เช่าทาง LINE</button>${c.owe ? `<button class="btn blk" style="margin-top:8px" onclick="paySheet(${q(b.id)})">💵 บันทึกรับเงิน</button>` : ''}`), 50);
}

        <div><span class="muted small">ค่าซ่อม ${fmtMonthS(lm)}</span><b>${money(rep.reduce((a, r) => a + (+r.cost || 0), 0))}</b><span class="muted small">${rep.length} งานเสร็จ</span></div></div>

        <div class="line" style="border:0"><span>เงินสด (${by('เงินสด').length} บิล)</span><span>${money(by('เงินสด').reduce((a, b) => a + +b.paidAmount, 0))}</span></div></div>
      ${IS_DEMO ? '<p class="muted small" style="text-align:center">ระบบจริง: ข้อมูลทั้งหมดอยู่ใน Google Sheet เปิดทำรายงานต่อได้ · มีปุ่มดาวน์โหลด CSV</p>' : `<button class="btn blk" onclick="downloadCsv('${lm}')">📥 ดาวน์โหลดบิลเดือนนี้ (Excel/CSV)</button>`}`,
  };
};
function downloadCsv(m) {
  const rows = [['เลขที่', 'ห้อง', 'ผู้เช่า', 'ประเภท', 'เดือน', 'ยอด', 'สถานะ', 'วิธีชำระ', 'วันที่รับเงิน', 'ใบเสร็จ']]
    .concat(D.bills.filter(b => b.month === m || (b.paidDate || '').slice(0, 7) === m).map(b => [b.no, b.room, b.tenantName, b.kind, b.month, b.total, b.status, b.payMethod, b.paidDate, b.receiptNo]));
  const csv = '﻿' + rows.map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'บิล-' + m + '.csv'; a.click();
}

  const list = D.bills.filter(fn).sort((a, b) => seg === 'todo' || seg === 'over' || seg === 'due' || seg === 'review' ? rank(a) - rank(b) || a.dueDate.localeCompare(b.dueDate) || a.room.localeCompare(b.room, undefined, { numeric: true }) : 0);

document.addEventListener('keydown', e => {

function paySheet(id, method) {

  if (!PAYS || PAYS.id !== id || !$('#sbg').classList.contains('on')) PAYS = { id, method: OWN() ? 'โอน/พร้อมเพย์' : 'เงินสด', amount: +b.total, date: today(), note: '', img: '', imgName: '', line: true };
  else payGrab();
  if (method) PAYS.method = method;
  const P = PAYS, t = +b.total, ten = tenantById(b.tenantId) || {}, opts = [...new Set([t, Math.ceil(t / 100) * 100, Math.ceil(t / 500) * 500, Math.ceil(t / 1000) * 1000, Math.ceil(t / 1000) * 1000 + 1000])].slice(0, 4);
  if (P.method === 'หักเงินมัดจำ') P.amount = t;
  openSheet(`<h3>💵 บันทึกรับเงิน · ห้อง ${esc(b.room)} คุณ${esc((b.tenantName || '').split(' ')[0])}</h3>
    <div class="row" style="flex-wrap:nowrap;background:#f6f7f9;border-radius:12px;padding:12px 16px;margin:6px 0 14px;align-items:flex-start"><div style="flex:1;min-width:0"><div class="muted small">${esc(billTitle(b))} · ${esc(b.no)}</div><div class="small" style="margin-top:2px">${b.items.map(i => esc(i.l) + ' ' + money(i.a)).join(' · ')}</div></div><div style="text-align:right;flex:none"><div class="muted small">ยอดที่ต้องรับ</div><b style="font-size:24px">${fmtB(t)}</b></div></div>
    ${b.status === 'รออนุมัติ' ? '<div class="badge b-o" style="margin-bottom:10px;white-space:normal">บิลนี้มีสลิปจากผู้เช่ารออนุมัติอยู่ — บันทึกรับเงินแทนการตรวจสลิปได้</div>' : ''}
    <div class="fl">รับเงินทาง</div><div class="segb">${[['โอน/พร้อมเพย์', '🏦 โอน / พร้อมเพย์'], ['เงินสด', '💵 เงินสด'], ['หักเงินมัดจำ', '🔁 หักเงินมัดจำ']].map(([k, l]) => `<button class="${P.method === k ? 'on' : ''}" onclick="paySheet(${q(id)},${q(k)})">${l}</button>`).join('')}</div>
    <div class="g2"><label class="f">${P.method === 'เงินสด' ? 'รับเงินมา (บาท)' : 'จำนวนเงินที่ได้รับ'}<input id="pAmt" type="number" inputmode="decimal" value="${esc(P.amount)}" style="font-size:18px;font-weight:700" oninput="payCalc(${t})" ${P.method === 'หักเงินมัดจำ' ? 'disabled' : ''}></label><label class="f">วันที่รับเงิน<input id="pDate" type="date" value="${esc(P.date)}"></label></div>
    ${P.method === 'เงินสด' ? `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:-4px 0 6px">${opts.map((v, i) => `<button class="btn sm" onclick="$('#pAmt').value=${v};payCalc(${t})">${i ? money(v) : 'พอดี'}</button>`).join('')}</div><div class="cmp" style="margin-top:4px"><div><span class="muted small">ยอดบิล</span><b>${money(t)}</b></div><div id="pChg"></div></div>` : ''}
    ${P.method === 'หักเงินมัดจำ' ? `<div class="card" style="background:var(--warn-soft);border:0;font-size:14px">หักจากเงินมัดจำของ${esc(ten.name ? ' คุณ' + ten.name : 'ผู้เช่า')} (มัดจำ ${fmtB(ten.deposit)}) · ไม่นับเป็นรายรับของเดือน</div>` : ''}
    ${P.method === 'โอน/พร้อมเพย์' ? `<div class="fl">รูปสลิป (ไม่บังคับ)</div><label class="paydrop" id="pDrop"><input type="file" accept="image/*" style="display:none" onchange="payPick(this.files[0])">
      ${P.img ? `<img src="${P.img}"><div style="flex:1;min-width:0"><b>${esc(P.imgName)}</b><div class="muted small">แตะเพื่อเปลี่ยนรูป · ระบบเช็คสลิปซ้ำให้ตอนบันทึก</div></div>` : `<span style="font-size:28px">📎</span><div style="flex:1"><b>แนบรูปสลิป</b><div class="muted small">ผู้เช่าส่งมาทาง LINE → บันทึกรูปแล้วลากมาวาง กด Ctrl+V หรือแตะเพื่อเลือกไฟล์</div></div>`}</label><div style="height:10px"></div>` : ''}
    <label class="f">หมายเหตุ<input id="pNote" value="${esc(P.note)}" placeholder="${P.method === 'โอน/พร้อมเพย์' ? 'เช่น โอนเข้าบัญชีกสิกรฯ' : 'ไม่บังคับ'}"></label>
    <div class="trow" style="border:0;padding-top:0"><button class="tog ${P.line ? 'on' : ''}" id="pLine" onclick="this.classList.toggle('on')"></button><div style="flex:1">ส่งใบเสร็จให้ผู้เช่าทาง LINE หลังบันทึก<div class="muted small">เปิดหน้าต่าง LINE พร้อมข้อความ${FL().billLink ? 'และลิงก์ใบเสร็จ' : ''}</div></div></div>
    <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" onclick="PAYS=null;closeSheet()">ยกเลิก</button><button class="btn ok lg" id="pBtn" onclick="payGo()">✓ บันทึกรับเงิน + ออกใบเสร็จ</button></div>`);
  payCalc(t);
  const d = $('#pDrop');
  if (d) { d.ondragover = e => { e.preventDefault(); d.classList.add('over'); }; d.ondragleave = () => d.classList.remove('over'); d.ondrop = e => { e.preventDefault(); d.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) payPick(f); }; }
}
function payCalc(t) {
  const el = $('#pChg'), v = +(($('#pAmt') || {}).value) || 0, d = v - t, btn = $('#pBtn');
  if (btn) btn.disabled = PAYS && PAYS.method !== 'หักเงินมัดจำ' && v < t;
  if (!el) return;
  el.innerHTML = d >= 0 ? `<span class="muted small">เงินทอน</span><b style="color:var(--ok)">${money(d)}</b>` : `<span class="muted small">ยังขาด</span><b style="color:var(--bad)">${money(-d)}</b>`;
  el.style.background = d >= 0 ? 'var(--ok-soft)' : 'var(--bad-soft)';
}
async function payPick(f) {
  if (!f || !PAYS) return;
  try { payGrab(); PAYS.img = await resizeImage(f, 1000, 0.72); PAYS.imgName = f.name || 'สลิปที่วาง.jpg'; paySheet(PAYS.id); } catch (e) { uiAlert(e.message); }
}
document.addEventListener('paste', e => {
  if (!PAYS || !$('#sbg').classList.contains('on') || !$('#pDrop')) return;
  const it = [...((e.clipboardData || {}).items || [])].find(i => i.type && i.type.startsWith('image/'));
  if (it) { e.preventDefault(); payPick(it.getAsFile()); }
});
async function payGo() {
  payGrab();
  const P = PAYS, b = billById(P.id);
  if (P.method !== 'หักเงินมัดจำ' && !(+P.amount >= +b.total)) return uiAlert('ยอดที่รับน้อยกว่ายอดบิล');
  const w = P.line ? preOpen() : null;
  let j;
  try { j = await api('recordPayment', { id: P.id, method: P.method, amount: P.amount, paidDate: P.date, note: P.note, image: P.method === 'โอน/พร้อมเพย์' ? P.img : '' }); }
  catch (e) { if (w) w.close(); return uiAlert(e.message); }
  const id = P.id; PAYS = null; closeSheet(); render();
  if (w) shareBill(id, w);
  billDone(id, 'บันทึกรับเงินแล้ว', (j.dup ? '⚠ รูปสลิปนี้' + j.dup + ' — ตรวจสอบอีกครั้ง<br>' : '') + (w ? 'เปิด LINE เพื่อส่งใบเสร็จให้ผู้เช่าแล้ว' : 'ออกใบเสร็จเรียบร้อย' + (FL().app ? ' · ผู้เช่าเห็นในแอป' : '')));
}

/* ---------- งานซ่อม (กระดาน 3 ช่อง) ---------- */
const RCATS = [['💡', 'ไฟฟ้า'], ['🚰', 'ประปา'], ['❄️', 'แอร์'], ['🚪', 'ประตู/กุญแจ'], ['📶', 'อินเทอร์เน็ต'], ['📦', 'อื่นๆ']];
const catIcon = c => (RCATS.find(x => x[1] === c) || ['🔧'])[0];
const SRC = [['📞', 'โทร'], ['💬', 'LINE'], ['🚶', 'มาบอกเอง'], ['👀', 'เจ้าของพบเอง']];
const srcIcon = s => (SRC.find(x => x[1] === s) || ['📝'])[0];
VIEWS.repairs = () => DESK() ? dRepairs() : mRepairs();
function mRepairs() {
  const seg = UI.repSeg || 'open', groups = { open: D.repairs.filter(repOpen), done: D.repairs.filter(r => r.status === 'เสร็จแล้ว'), broken: D.repairs.filter(r => r.status === 'ซ่อมไม่ได้') };
  const pc = { 'รอดำเนินการ': 'b-warn', 'กำลังซ่อม': 'b-o', 'เสร็จแล้ว': 'b-ok', 'ซ่อมไม่ได้': 'b-bad' };
  return {
    title: 'งานซ่อม', sub: 'ยังไม่เสร็จ ' + groups.open.length + ' งาน', right: `<button class="pill" onclick="newRepairSheet()">+ บันทึก</button>`,
    html: `<div class="seg">${[['open', 'ยังไม่เสร็จ'], ['done', 'เสร็จแล้ว'], ['broken', 'ซ่อมไม่ได้']].map(([k, l]) => `<button class="${k === seg ? 'on' : ''}" onclick="UI.repSeg='${k}';render()">${l} ${groups[k].length}</button>`).join('')}</div>
      ${groups[seg].map(r => `<div class="card tap" onclick="repairSheet(${q(r.id)})"><div class="row"><b style="font-size:17px">ห้อง ${esc(r.room)}</b><span class="badge">${catIcon(r.category)} ${esc(r.category)}</span>${r.urgent && repOpen(r) ? '<span class="badge b-bad">ด่วน</span>' : ''}<span class="sp"></span><span class="badge ${pc[r.status] || ''}">${esc(r.status)}</span></div>
        <div class="row" style="margin-top:8px;flex-wrap:nowrap;align-items:flex-start">${r.photoId ? `<img class="thumb" data-file="${esc(r.photoId)}">` : ''}<div style="flex:1;min-width:0">${esc(r.detail)}<div class="muted small">${esc(repWho(r))} · ${ago(r.createdAt)}</div>
        ${r.status === 'ซ่อมไม่ได้' && r.outcome ? `<div class="small" style="color:var(--bad)">${esc(r.outcome)}</div>` : ''}${r.appointAt && repOpen(r) ? `<div class="small">📅 นัดช่าง ${fmtDateTime(r.appointAt)}</div>` : ''}${+r.cost ? `<div class="small">${r.status === 'ซ่อมไม่ได้' ? 'ค่าเสียหาย' : 'ค่าซ่อม'} ${fmtB(r.cost)}${r.billId ? ' · ออกบิลแล้ว' : ''}</div>` : ''}</div></div>
        ${r.status === 'รอดำเนินการ' ? `<div class="row" style="margin-top:8px" onclick="event.stopPropagation()"><button class="btn sm pri" onclick="takeJob(${q(r.id)})">รับงาน</button>${r.phone ? `<button class="btn sm" onclick="callPhone(${q(r.phone)})">📞 โทร</button>` : ''}</div>` : ''}</div>`).join('') || `<div class="empty">${seg === 'open' ? 'ไม่มีงานค้าง 👍' : 'ไม่มีรายการ'}</div>`}`,
    after: () => document.querySelectorAll('img[data-file]').forEach(async im => { try { im.src = await getImg(im.dataset.file); } catch (e) {} }),
  };
}
VIEWS.moveout = id => {
  const v = M.moveout(id), t = tenantById(id);
  if (!t) return v;
  const dm = D.repairs.filter(r => r.room === t.room && r.status === 'ซ่อมไม่ได้' && !r.billId && r.createdAt.slice(0, 10) >= t.startDate);
  if (dm.length) v.html = `<div class="card" style="background:var(--bad-soft);border:0"><b style="color:var(--bad)">❌ ของเสียหายที่บันทึกไว้ (ยังไม่ได้เก็บเงิน)</b>${dm.map(r => `<div class="line"><span>${esc(r.category)} · ${esc(r.detail.slice(0, 40))}${r.outcome ? ' (' + esc(r.outcome) + ')' : ''}</span><span>${+r.cost ? fmtB(r.cost) : '-'}</span></div>`).join('')}<div class="muted small" style="margin-top:4px">ใส่ยอดที่จะหักในช่อง “ค่าทำความสะอาด/เสียหาย” ด้านล่าง</div></div>` + v.html;
  return v;
};
function dRepairs() {
  const cat = UI.repCat || '', known = RCATS.slice(0, 5).map(x => x[1]);
  const list = D.repairs.filter(r => !cat || (cat === 'อื่นๆ' ? !known.includes(r.category) : r.category === cat));
  const done = list.filter(r => r.status === 'เสร็จแล้ว'), broken = list.filter(r => r.status === 'ซ่อมไม่ได้'), cm = curMonth();
  const col = (st, icon, pc, arr, badge) => `<div class="kcol" data-st="${st}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="repDrop(event,this)"><h4>${icon} ${st} <span class="pl ${pc}">${badge != null ? badge : arr.length}</span></h4>${arr.map(repCard).join('') || '<div class="muted small" style="text-align:center;padding:24px 0">ไม่มีงาน</div>'}</div>`;
  return {
    title: 'งานซ่อม', sub: 'ลากการ์ดเพื่อเปลี่ยนสถานะ · คลิกการ์ดเพื่อแก้ไข', wide: true,
    dright: `<button class="pill ${OWN() ? 'pri' : ''}" onclick="newRepairSheet()">＋ บันทึกแจ้งซ่อม</button>`,

      <div class="kan">${col('รอดำเนินการ', '🆕', 'warn', list.filter(r => r.status === 'รอดำเนินการ'))}${col('กำลังซ่อม', '🛠', 'o', list.filter(r => r.status === 'กำลังซ่อม'))}${col('เสร็จแล้ว', '✅', 'ok', done.slice(0, 12), 'เดือนนี้ ' + done.filter(r => (r.updatedAt || '').slice(0, 7) === cm).length)}${col('ซ่อมไม่ได้', '❌', 'bad', broken.slice(0, 12))}</div>`,
    after: () => document.querySelectorAll('img[data-file]').forEach(async im => { try { im.src = await getImg(im.dataset.file); } catch (e) {} }),
  };

function repWho(r) { return r.source ? srcIcon(r.source) + ' ' + (r.source === 'เจ้าของพบเอง' ? 'เจ้าของพบเอง' : 'ผู้เช่า' + (r.source === 'มาบอกเอง' ? 'มาบอก' : r.source === 'LINE' ? 'แจ้งทาง LINE' : 'โทรแจ้ง')) + ' · บันทึกโดยเจ้าของ' : (r.name || '') + (r.phone ? ' · ' + r.phone : ''); }
function repCard(r) {
  return `<div class="jc" draggable="true" ondragstart="event.dataTransfer.setData('text',${q(r.id)});this.classList.add('drag')" ondragend="this.classList.remove('drag')" onclick="repairSheet(${q(r.id)})">
    <div class="row" style="flex-wrap:nowrap"><span class="pl">ห้อง ${esc(r.room)}</span>${r.urgent ? '<span class="pl bad">ด่วน</span>' : ''}<span class="sp"></span><span class="muted small">${ago(repOpen(r) ? r.createdAt : r.updatedAt)}</span></div>

    ${(r.photoId || (r.allowEntry === 'ได้' && repOpen(r))) ? `<div class="row" style="margin-top:8px">${r.photoId ? `<img class="shot" data-file="${esc(r.photoId)}">` : ''}${r.allowEntry === 'ได้' && repOpen(r) ? '<span class="pl ok">อนุญาตเข้าห้อง</span>' : ''}</div>` : ''}
    ${r.appointAt && repOpen(r) ? `<div class="small" style="margin-top:6px">📅 นัดช่าง ${fmtDateTime(r.appointAt)}</div>` : ''}
    ${r.ownerMsg ? `<div class="bubble">💬 ${FL().app ? 'แจ้งผู้เช่า' : 'บันทึก'}: “${esc(r.ownerMsg)}”</div>` : ''}
    ${r.status === 'ซ่อมไม่ได้' ? `<div style="margin-top:8px"><span class="pl bad">ของเสียหาย</span> ${r.outcome ? `<span class="pl">${esc(r.outcome)}</span>` : ''}</div>` : ''}
    ${+r.cost ? `<div class="small" style="margin-top:6px">${r.status === 'ซ่อมไม่ได้' ? 'ค่าเสียหาย/ของใหม่' : 'ค่าใช้จ่าย'} ${fmtB(r.cost)} · ${r.billId ? '<span style="color:var(--ok)">✓ ออกบิลเก็บผู้เช่าแล้ว</span>' : '<span style="color:var(--o)">ไม่เก็บผู้เช่า</span>'}</div>` : ''}
    ${r.status === 'รอดำเนินการ' ? `<div class="row" style="margin-top:10px" onclick="event.stopPropagation()"><button class="btn sm pri" onclick="takeJob(${q(r.id)})">รับงาน</button>${r.phone ? `<button class="btn sm" onclick="callPhone(${q(r.phone)})">📞 โทร</button>` : ''}</div>` : ''}</div>`;
}
async function repDrop(e, col) {
  e.preventDefault(); col.classList.remove('over');
  const id = e.dataTransfer.getData('text'), r = D.repairs.find(x => x.id === id);
  if (!r || r.status === col.dataset.st) return;
  await act('saveRepair', { repair: { id, status: col.dataset.st } }, 'ย้ายไป “' + col.dataset.st + '” แล้ว'); render();
}
async function takeJob(id) { await act('saveRepair', { repair: { id, status: 'กำลังซ่อม' } }, 'รับงานแล้ว · ย้ายไป “กำลังซ่อม”'); render(); }
function repairSheet(id) {
  const r = D.repairs.find(x => x.id === id); if (!r) return;
  const app = FL().app;
  openSheet(`<h3>${catIcon(r.category)} ห้อง ${esc(r.room)} · ${esc(r.category)}</h3><div class="muted small">${esc(repWho(r))} · แจ้ง ${fmtDateTime(r.createdAt)}</div>
    <div class="row" style="margin:10px 0;flex-wrap:nowrap;align-items:flex-start">${r.photoId ? `<img class="thumb" data-file="${esc(r.photoId)}" onclick="viewFile(${q(r.photoId)})">` : ''}<div style="flex:1">${esc(r.detail)}</div></div>

    <div id="rsOut" class="${r.status === 'ซ่อมไม่ได้' ? '' : 'hide'}"><div class="fl">ตรวจแล้วซ่อมไม่ได้ — จัดการอย่างไร</div><div class="segb" id="rsOutSeg">${OUTCOMES.map(x => `<button data-v="${x}" class="${x === (r.outcome || OUTCOMES[0]) ? 'on' : ''}" onclick="segPick(this)">${x}</button>`).join('')}</div></div>

/* ---------- เอกสาร / รูปของห้อง: สัญญาเช่า บัตร รูปห้องตอนเข้า-ออก ---------- */
const DOCCAT = [['สัญญาเช่า', '📄'], ['เอกสารผู้เช่า', '🪪'], ['รูปห้องตอนเข้า', '📷'], ['รูปห้องตอนออก', '📸'], ['อื่นๆ', '📎']];

    <div class="docs">${cur.map(item).join('') || '<div class="muted small" style="grid-column:1/-1">ยังไม่มีไฟล์ · แนบสัญญาเช่า รูปบัตร หรือรูปห้องได้</div>'}</div>
    ${Object.keys(oldBy).map(k => `<details style="margin-top:8px"><summary class="muted small" style="cursor:pointer">ผู้เช่าเก่า: ${esc(k)} · ${oldBy[k].length} ไฟล์</summary><div class="docs" style="margin-top:6px">${oldBy[k].map(item).join('')}</div></details>`).join('')}`;

function loadDocThumbs() { document.querySelectorAll('img.dthumb[data-file]:not([src])').forEach(async im => { try { im.src = await getImg(im.dataset.file); } catch (e) { im.alt = '⚠'; } }); }
function dataUrlBlob(u) { const [h, b] = u.split(','), mime = (h.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream', bin = atob(b), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: mime }); }
async function viewDoc(id) {
  const d = (D.docs || []).find(x => x.id === id); if (!d) return;
  const img = /^image/.test(d.mime), tt = tenantById(d.tenantId);
  openSheet(`<h3>${docCatIcon(d.category)} ${esc(d.category)} · ห้อง ${esc(d.room)}</h3><div class="muted small">${esc(d.name)} · ${fmtDateTime(d.createdAt)} · ${fmtSize(d.size)}${tt ? ' · ' + esc(tt.name) : ''}</div>
    ${d.note ? `<div class="bubble">${esc(d.note)}</div>` : ''}
    <div id="dvBox" class="empty">กำลังโหลด…</div>
    <div class="fl" style="margin-top:10px">ย้ายไปหมวด</div><div class="segb" id="dvCat">${DOCCAT.map(([c, i]) => `<button class="${c === d.category ? 'on' : ''}" onclick="act('updateDoc',{id:${esc(JSON.stringify(id))},category:${esc(JSON.stringify(c))}},'ย้ายหมวดแล้ว').then(()=>{render();viewDoc(${esc(JSON.stringify(id))})})">${i} ${c}</button>`).join('')}</div>
    <div class="row" style="margin-top:6px"><a class="btn dis" id="dvOpen" target="_blank" rel="noopener">🔍 เปิดเต็ม</a><a class="btn dis" id="dvDl" download="${esc(d.name)}">⬇️ ดาวน์โหลด</a><span class="sp"></span><button class="btn bad" onclick="delDoc(${q(id)})">🗑 ลบ</button></div>`);
  try {
    const src = await getImg(d.fileId), url = URL.createObjectURL(dataUrlBlob(src)), box = $('#dvBox'); if (!box) return;
    box.outerHTML = img ? `<img src="${src}" class="slipimg" style="margin-top:10px" onclick="viewFile(${q(d.fileId)})">`
      : DESK() ? `<iframe src="${url}" style="width:100%;height:60vh;border:1px solid var(--line);border-radius:10px;margin-top:10px"></iframe>` : `<div class="card" style="text-align:center;margin-top:10px">📄 ไฟล์ PDF · ${fmtSize(d.size)}<div class="muted small">กด “เปิดเต็ม” เพื่ออ่าน</div></div>`;
    ['#dvOpen', '#dvDl'].forEach(s => { const a = $(s); if (a) { a.href = url; a.classList.remove('dis'); } });

function readAsDataUrl(f) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('อ่านไฟล์ไม่ได้')); r.readAsDataURL(f); }); }
async function dcPick(files) {
  if (!DC) return;
  for (const f of [...files]) {
    try {
      if (f.type === 'application/pdf') { if (f.size > 10 * 1048576) { uiAlert(f.name + ' ใหญ่เกิน 10 MB'); continue; } DC.files.push({ name: f.name, mime: f.type, data: await readAsDataUrl(f), size: f.size }); }
      else if (/^image\//.test(f.type) || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name)) { let data; try { data = await resizeImage(f, 1800, 0.82); } catch (e) { data = await readAsDataUrl(f); } DC.files.push({ name: (f.name || 'รูป').replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', data, size: Math.round(data.length * 0.75) }); }
      else uiAlert(f.name + ': รองรับเฉพาะรูปภาพและ PDF');
    } catch (e) { uiAlert(e.message); }
  }
  $('#dcList').innerHTML = DC.files.map((f, i) => `<div class="item" style="padding:6px 0">${/^image/.test(f.mime) ? `<img src="${f.data}" class="shot">` : '<div class="shot" style="display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--bad)">PDF</div>'}<div style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(f.name)}<div class="muted small">${fmtSize(f.size)}</div></div><button class="btn sm" onclick="DC.files.splice(${i},1);dcPick([])">✕</button></div>`).join('');
  $('#dcBtn').disabled = !DC.files.length; $('#dcBtn').textContent = '⬆️ อัปโหลด' + (DC.files.length ? ' ' + DC.files.length + ' ไฟล์' : '');
}
document.addEventListener('paste', e => {

/* ---------- ค่าเช่าเดือนไม่เต็ม (ตรงกับ backend: ค่าเช่า − วันที่ไม่ได้อยู่ × ค่ารายวัน) ---------- */
function partRent(rent, days, dim) {
  const daily = +S().dailyRate || 0;
  if (days >= dim) return rent;
  return daily > 0 ? Math.max(0, Math.min(rent, Math.round(rent - (dim - days) * daily))) : Math.round(rent * days / dim);
}

async function resetRoomRun(no) {
  if (!await uiConfirm('ยืนยันล้างข้อมูลผู้เช่าห้อง ' + no + '?\nลบแล้วกู้คืนไม่ได้', 'ล้างเลย', true)) return;
  await act('resetRoom', { room: no, docs: $('#rrDocs') && $('#rrDocs').checked, repairs: $('#rrRep') && $('#rrRep').checked }, 'ล้างข้อมูลห้อง ' + no + ' แล้ว');
  closeSheet(); render();
}

/* ---------- ห้องจอง / ห้องซ่อม: รายละเอียดเต็ม ---------- */
const TH_SHORT_Y = d => String(+d.slice(0, 4) + 543).slice(2);
function fmtBook(at) { if (!at) return ''; const d = String(at); return d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + TH_SHORT_Y(d) + (d.length > 10 && d.slice(11, 16) ? ' ' + d.slice(11, 16) + 'น.' : ''); }
function fmtBookLong(at) { if (!at) return '-'; const d = String(at); return fmtDate(d.slice(0, 10)) + (d.length > 10 && d.slice(11, 16) ? ' เวลา ' + d.slice(11, 16) + ' น.' : ''); }
function roomStatusCard(r) {
  const no = r.room;
  if (r.status === 'จอง') {
    const left = r.bookAt ? daysBetween(today(), r.bookAt.slice(0, 10)) : null;
    return `<div class="card stc st-book"><div class="row"><b style="font-size:17px;flex:1">📅 ห้องนี้จองแล้ว</b>${left != null ? `<span class="pl ${left < 0 ? 'bad' : left <= 3 ? 'warn' : ''}">${left < 0 ? 'เลยวันเข้า ' + (-left) + ' วัน' : left === 0 ? 'เข้าวันนี้' : 'อีก ' + left + ' วัน'}</span>` : ''}</div>
      <div class="line"><span class="muted">ผู้จอง</span><b>${esc(r.bookName || '-')}</b></div>
      <div class="line"><span class="muted">เบอร์โทร</span><span>${r.bookPhone ? `<a class="tap" onclick="callPhone(${q(r.bookPhone)})">📞 ${esc(r.bookPhone)}</a>` : '-'}</span></div>
      <div class="line"><span class="muted">วันเวลาเข้าอยู่</span><b>${fmtBookLong(r.bookAt)}</b></div>
      <div class="line"><span class="muted">เงินจอง</span><span>${+r.bookDeposit ? fmtB(r.bookDeposit) : '-'}</span></div>
      ${r.bookNote ? `<div class="bubble" style="margin-top:8px">${esc(r.bookNote).replace(/\n/g, '<br>')}</div>` : ''}
      <div class="row" style="margin-top:10px"><button class="btn sm" style="flex:1" onclick="bookSheet(${q(no)})">✏️ แก้ไขการจอง</button><button class="btn sm" style="flex:1;color:var(--bad)" onclick="clearRoomStatus(${q(no)},'ยกเลิกการจองห้อง ${esc(no)}?')">✕ ยกเลิกจอง</button></div></div>`;
  }
  if (r.status === 'ซ่อม') {
    const reps = D.repairs.filter(x => x.room === no && repOpen(x)), days = r.fixSince ? daysBetween(r.fixSince, today()) : null;
    const hv = r.fixLevel === 'หนัก';
    return `<div class="card stc st-fix ${hv ? 'st-heavy' : ''}"><div class="row"><b style="font-size:17px;flex:1">${hv ? '🧱 ห้องนี้ซ่อมหนัก' : '🔧 ห้องนี้กำลังซ่อม'}</b>${days != null ? `<span class="pl">${days ? days + ' วันแล้ว' : 'เริ่มวันนี้'}</span>` : ''}</div>
      <div class="bubble" style="margin:8px 0;font-size:15px">${r.fixNote ? esc(r.fixNote).replace(/\n/g, '<br>') : '<span class="muted">ยังไม่ได้ใส่รายละเอียด</span>'}</div>
      <div class="line"><span class="muted">เริ่มซ่อม</span><span>${r.fixSince ? fmtDate(r.fixSince) : '-'}</span></div>
      <div class="line"><span class="muted">คาดว่าเสร็จ</span><span>${r.fixDue ? fmtDate(r.fixDue) : '-'}</span></div>
      ${reps.length ? `<div class="fl" style="margin-top:8px">งานแจ้งซ่อมของห้องนี้</div>${reps.map(x => `<div class="item tap" onclick="repairSheet(${q(x.id)})"><span>🔧</span><div style="flex:1;min-width:0">${esc(x.category)} · ${esc(String(x.detail || '').slice(0, 50))}</div><span class="pl warn">${esc(x.status)}</span></div>`).join('')}` : ''}
      <div class="row" style="margin-top:10px"><button class="btn sm" style="flex:1" onclick="fixSheet(${q(no)})">✏️ แก้ไขรายละเอียด</button><button class="btn sm ok" style="flex:1" onclick="clearRoomStatus(${q(no)},'ห้อง ${esc(no)} ซ่อมเสร็จแล้ว พร้อมให้เช่า?')">✓ ซ่อมเสร็จ</button></div></div>`;
  }
  return `<div class="row" style="margin-bottom:10px"><button class="btn" style="flex:1" onclick="bookSheet(${q(no)})">📅 บันทึกการจอง</button><button class="btn" style="flex:1" onclick="fixSheet(${q(no)})">🔧 ตั้งเป็นห้องซ่อม</button></div>`;
}
function bookSheet(no) {
  const r = D.rooms.find(x => x.room === no) || {}, at = r.bookAt || '', d = at.slice(0, 10) || today(), t = at.slice(11, 16) || '12:00';
  openSheet(`<h3>📅 ${r.status === 'จอง' ? 'แก้ไขการจอง' : 'บันทึกการจอง'} · ห้อง ${esc(no)}</h3><div id="fBook">
    <div class="g2"><label class="f">ชื่อผู้จอง *<input name="bookName" value="${esc(r.bookName || '')}" placeholder="ชื่อ-นามสกุล"></label><label class="f">เบอร์โทร<input name="bookPhone" inputmode="tel" value="${esc(r.bookPhone || '')}"></label>
    <label class="f">วันที่เข้าอยู่ *<input name="d" type="date" value="${d}"></label><label class="f">เวลา<input name="t" type="time" value="${t}"></label>
    <label class="f">เงินจอง (บาท)<input name="bookDeposit" type="number" inputmode="numeric" value="${esc(r.bookDeposit || '')}" placeholder="0"></label></div>
    <label class="f">รายละเอียดเพิ่มเติม<textarea name="bookNote" rows="3" placeholder="เช่น จองผ่าน LINE · ขอห้องชั้นบน · มากับแฟน 2 คน">${esc(r.bookNote || '')}</textarea></label></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeSheet()">ยกเลิก</button><button class="btn pri" onclick="saveBook(${q(no)})">บันทึกการจอง</button></div>`);
}
async function saveBook(no) {
  const o = formObj('#fBook'); if (!o.bookName) return uiAlert('กรุณาใส่ชื่อผู้จอง'); if (!o.d) return uiAlert('กรุณาเลือกวันที่เข้าอยู่');
  await act('saveRoom', { room: { room: no, status: 'จอง', bookName: o.bookName, bookPhone: o.bookPhone, bookAt: o.d + (o.t ? ' ' + o.t : ''), bookDeposit: o.bookDeposit, bookNote: o.bookNote }, isNew: false }, 'บันทึกการจองแล้ว');
  closeSheet(); render();
}
function fixSheet(no) {
  const r = D.rooms.find(x => x.room === no) || {};
  openSheet(`<h3>🔧 ${r.status === 'ซ่อม' ? 'แก้ไขรายละเอียดการซ่อม' : 'ตั้งเป็นห้องซ่อม'} · ห้อง ${esc(no)}</h3><div id="fFix">
    <label class="f" style="margin-bottom:4px">ระดับการซ่อม</label><div class="seg fixlv" style="margin-bottom:6px"><button class="${r.fixLevel === 'หนัก' ? '' : 'on'}" data-lv="" onclick="segPick(this)">🔧 ซ่อมทั่วไป</button><button class="hv ${r.fixLevel === 'หนัก' ? 'on' : ''}" data-lv="หนัก" onclick="segPick(this)">🧱 ซ่อมหนัก</button></div><p class="muted small" style="margin:0 0 8px">ซ่อมหนัก = ใช้เวลานาน ปล่อยเช่าไม่ได้ เช่น รีโนเวททั้งห้อง น้ำรั่วซึม เปลี่ยนพื้น</p>
    <label class="f">ซ่อมอะไรอยู่ *<textarea name="fixNote" rows="4" placeholder="เช่น ทาสีใหม่ทั้งห้อง · เปลี่ยนก๊อกน้ำ · แอร์รั่ว รอช่าง">${esc(r.fixNote || '')}</textarea></label>
    <div class="g2"><label class="f">เริ่มซ่อม<input name="fixSince" type="date" value="${r.fixSince || today()}"></label><label class="f">คาดว่าเสร็จ<input name="fixDue" type="date" value="${r.fixDue || ''}"></label></div></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeSheet()">ยกเลิก</button><button class="btn pri" onclick="saveFix(${q(no)})">บันทึก</button></div>`);
}
async function saveFix(no) {
  const o = formObj('#fFix'); if (!o.fixNote) return uiAlert('กรุณาใส่รายละเอียดว่าซ่อมอะไร');
  const lv = (document.querySelector('.fixlv button.on') || {}).dataset; const fixLevel = lv && lv.lv === 'หนัก' ? 'หนัก' : '';
  await act('saveRoom', { room: { room: no, status: 'ซ่อม', fixNote: o.fixNote, fixSince: o.fixSince, fixDue: o.fixDue, fixLevel }, isNew: false }, 'บันทึกแล้ว');
  closeSheet(); render();
}
async function clearRoomStatus(no, msg) { if (!await uiConfirm(msg)) return; await act('saveRoom', { room: { room: no, status: 'ว่าง' }, isNew: false }, 'ห้อง ' + no + ' พร้อมให้เช่าแล้ว'); closeSheet(); render(); }

/* ---------- ปุ่มรีเฟรช: ดึงข้อมูลล่าสุดจาก Google Sheet ---------- */
let RF_BUSY = false;
async function manualRefresh(btn) {
  if (RF_BUSY) return; RF_BUSY = true;
  document.querySelectorAll('.rfbtn').forEach(b => b.classList.add('spin'));
  try { await api('getAll', {}, true); closeSheet(); render(); toast('อัปเดตข้อมูลล่าสุดแล้ว · ' + new Date().toTimeString().slice(0, 5) + ' น.'); }
  catch (e) { uiAlert('รีเฟรชไม่สำเร็จ: ' + e.message); }
  finally { RF_BUSY = false; document.querySelectorAll('.rfbtn').forEach(b => b.classList.remove('spin')); }
}
</script>
</body>
</html>
