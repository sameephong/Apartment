<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เจ้าของหอ · ระบบบริหารอพาร์ทเม้นท์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=3.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>document.write('<script src="config.js?t=' + Date.now() + '"><\/script>')</script>
<script src="common.js?v=3.0"></script>
</head>
<body class="admin">
<div class="wrap">
  <div id="login" class="bd" style="padding-top:12vh">
    <div class="card">
      <div style="text-align:center;font-size:40px">🔑</div>
      <h4 style="text-align:center;font-size:20px">เข้าสู่ระบบเจ้าของหอ</h4><p class="muted small" style="text-align:center" id="bldLine"></p>
      <label class="f">รหัสผ่าน<input id="pw" type="password" autocomplete="current-password"></label>
      <button class="btn pri blk lg" id="loginBtn" onclick="doLogin()">เข้าสู่ระบบ</button>
      <p class="muted" id="loginErr" style="color:var(--bad)"></p>
      <p class="muted" id="demoHint"></p>
    </div>
    <p class="muted" style="text-align:center"><a href="tenant.html">สำหรับผู้เช่า</a> · <a href="index.html">หน้าแรก</a></p>
  </div>
  <div id="app" class="hide">
    <aside class="side" id="side"></aside>
    <div id="demo"></div>
    <div class="hd" id="hd"></div>
    <div class="bd" id="view"></div>
    <div class="nav" id="nav"></div>
  </div>
</div>
<div class="sheet-bg" id="sbg" onclick="if(event.target===this)closeSheet()"><div class="sheet"><button class="x" onclick="closeSheet()">×</button><div id="sbody"></div></div></div>
<div id="toast"></div>
<div id="loading"><div>กำลังบันทึก…</div></div>

<script>
let PW = '', D = null, ROUTE = ['home'], UI = { billSeg: 'todo', billMonth: '', repSeg: 'open', meterUtil: 'water', showLeft: false, reportMonth: '' };
const IMG = {};
const $ = s => document.querySelector(s);
const q = s => esc(JSON.stringify(String(s)));

/* ================= พื้นฐาน ================= */
function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3000); }
function openSheet(h) { $('#sbody').innerHTML = h; $('#sbg').classList.add('on'); }
function closeSheet() { $('#sbg').classList.remove('on'); }
function today() { return D.serverToday; }
function curMonth() { return today().slice(0, 7); }
function S() { return D.settings; }
function FL() { return Object.assign({ mode: 'shared', app: true, slip: true, repair: true, news: true, billLink: true }, (D && D.settings && D.settings.flags) || {}); }
const OWN = () => FL().mode === 'owner';
const DESK = () => window.matchMedia('(min-width:1024px)').matches;
async function api(action, payload, quiet) {
  if (!quiet) $('#loading').style.display = 'flex';
  try { const j = await callApi(action, Object.assign({ password: PW }, payload || {})); if (j.data) { D = j.data; cacheData('owner_cache', D); } return j; }
  finally { $('#loading').style.display = 'none'; }
}
async function act(action, payload, msg) {
  try { const j = await api(action, payload); if (msg) toast(msg); return j; }
  catch (e) { uiAlert(e.message); throw e; }
}
function go(h) { if (location.hash === '#' + h) render(); else location.hash = h; }
window.addEventListener('hashchange', () => { closeSheet(); render(); window.scrollTo(0, 0); });
function openLine(text) { const a = document.createElement('a'); a.href = 'https://line.me/R/share?text=' + encodeURIComponent(text); a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }
function tenantUrl(room) { return new URL(withB('tenant.html' + (room ? '?room=' + encodeURIComponent(room) : '')), location.href).href; }

/* ================= ข้อมูล ================= */
const active = () => D.tenants.filter(t => t.status === 'อยู่');
const tenantOf = room => D.tenants.find(t => t.room === room && t.status === 'อยู่');
const tenantById = id => D.tenants.find(t => t.id === id);
const billById = id => D.bills.find(b => b.id === id);
const isOverdue = b => b.status === 'รอชำระ' && b.dueDate < today();
const openBills = () => D.bills.filter(b => b.status !== 'ชำระแล้ว');
function statusBadge(b) {
  if (b.status === 'ชำระแล้ว') return '<span class="badge b-ok">ชำระแล้ว</span>';
  if (b.status === 'รออนุมัติ') return '<span class="badge b-o">สลิปรออนุมัติ</span>';
  if (isOverdue(b)) return `<span class="badge b-bad">เกินกำหนด ${daysBetween(b.dueDate, today())} วัน</span>`;
  return '<span class="badge b-warn">รอชำระ</span>';
}
function latestMonthly() { const m = D.bills.filter(b => b.kind === 'รายเดือน').map(b => b.month).sort(); return m[m.length - 1]; }
function prevReading(room, month) {
  const rec = D.meters.find(m => m.month === month && m.room === room);
  const earlier = D.meters.filter(m => m.room === room && m.month < month).sort((a, b) => b.month.localeCompare(a.month));
  const pick = k => { if (rec && rec[k + 'Prev'] !== '') return rec[k + 'Prev']; for (const m of earlier) { if (m[k + 'Cur'] !== '') return m[k + 'Cur']; if (m[k + 'Prev'] !== '') return m[k + 'Prev']; } return ''; };
  return { water: pick('water'), elec: pick('elec') };
}
function meterRooms(month) { return active().filter(t => t.startDate.slice(0, 7) <= month).sort((a, b) => a.room.localeCompare(b.room, undefined, { numeric: true })); }
function meterDone(month) { return meterRooms(month).filter(t => { const r = D.meters.find(m => m.month === month && m.room === t.room); return r && r.waterCur !== '' && r.elecCur !== ''; }).length; }
function badgeCounts() {
  return { bills: D.bills.filter(b => b.status === 'รออนุมัติ' || isOverdue(b)).length, repairs: D.repairs.filter(r => r.status === 'รอดำเนินการ').length };
}

/* ================= เข้าสู่ระบบ ================= */
async function doLogin() {
  PW = $('#pw').value; $('#loginErr').textContent = ''; $('#loginBtn').disabled = true; $('#loginBtn').textContent = 'กำลังเข้าสู่ระบบ…';
  try { await api('login', {}, true); store('owner_pw', PW); start(); }
  catch (e) { $('#loginErr').textContent = e.message; }
  $('#loginBtn').disabled = false; $('#loginBtn').textContent = 'เข้าสู่ระบบ';
}
function logout() { store('owner_pw'); store('owner_cache'); location.href = 'admin.html'; }
function start() { $('#login').classList.add('hide'); $('#app').classList.remove('hide'); $('#demo').innerHTML = demoBanner('<a href="tenant.html">ลองฝั่งผู้เช่า</a>'); render(); }
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
(async () => {
  await new Promise(r => setTimeout(r)); // รอให้สคริปต์ทั้งหน้าโหลดเสร็จก่อน
  if (IS_DEMO) $('#demoHint').innerHTML = 'โหมดทดลอง: รหัสผ่าน <b>1234</b>';
  if (BLD_MANY && BLD) $('#bldLine').innerHTML = `🏢 <b>${esc(BLD.name || BLD.code)}</b> (รหัส ${esc(BLD.code)}) · <a href="#" onclick="changeBuilding();return false">เปลี่ยนตึก</a>`;
  const saved = load('owner_pw');
  if (!saved) { if (!IS_DEMO) callApi('publicInfo').catch(() => {}); return; } // ปลุกเซิร์ฟเวอร์ไว้ระหว่างพิมพ์รหัส
  PW = saved;
  const cached = loadData('owner_cache');
  if (cached && cached.settings) { D = cached; start(); } // เปิดหน้าทันทีจากข้อมูลที่จำไว้
  syncBadge(true);
  try { await api('getAll', {}, true); if (cached && cached.settings) render(); else start(); }
  catch (e) { if (/รหัสผ่าน/.test(e.message)) { store('owner_pw'); store('owner_cache'); location.reload(); } else if (!cached) $('#loginErr').textContent = e.message; }
  syncBadge(false);
})();
async function refresh() { syncBadge(true); try { await api('getAll', {}, true); if (!$('#sbg').classList.contains('on')) render(); } catch (e) {} syncBadge(false); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && D && !$('#sbg').classList.contains('on') && ROUTE[0] !== 'meters') refresh(); });

/* ================= Render ================= */
const VIEWS = {};
function render() {
  if (!D) return;
  ROUTE = (location.hash.slice(1) || 'home').split('/').map(decodeURIComponent);
  const desk = DESK(), v = (VIEWS[ROUTE[0]] || VIEWS.home)(...ROUTE.slice(1));
  $('#hd').innerHTML = (v.back ? `<button class="back" onclick="history.length>1?history.back():go('${v.back}')">‹</button>` : '') +
    `<div class="tt"><b>${v.title}</b>${v.sub ? `<span>${v.sub}</span>` : ''}</div>` + (desk ? (v.dright != null ? v.dright : (v.right || '')) + deskTools() : (v.right || ''));
  $('#view').innerHTML = desk && !v.wide ? `<div class="narrow">${v.html}</div>` : v.html;
  if (desk) renderSide(v);
  const nav = v.nav || ROUTE[0], c = badgeCounts();
  $('#nav').innerHTML = [['home', '🏠', 'ภาพรวม'], ['rooms', '🚪', 'ห้อง'], ['bills', '💰', 'บิล/เงิน', c.bills], ['repairs', '🔧', 'แจ้งซ่อม', c.repairs], ['more', '☰', 'เพิ่มเติม']]
    .map(([k, i, l, n]) => `<button class="${k === nav ? 'on' : ''}" onclick="go('${k}')"><i>${i}</i>${l}${n ? `<span class="n">${n}</span>` : ''}</button>`).join('');
  document.title = v.title + ' · ' + S().apartmentName;
  if (v.after) v.after();
}

/* ---------- O1 ภาพรวม ---------- */
VIEWS.home = () => {
  const s = S(), rooms = D.rooms, occ = rooms.filter(r => r.status === 'มีผู้เช่า').length;
  if (!rooms.length) return { title: s.apartmentName, sub: fmtDayLong(today()), html: `<div class="card"><h4>เริ่มต้นใช้งาน 👋</h4><p>1. ตั้งชื่อหอ ค่าน้ำ ค่าไฟ พร้อมเพย์<br>2. สร้างห้องทีละหลายห้อง<br>3. เช็คอินผู้เช่าแต่ละห้อง</p><button class="btn pri blk" onclick="go('settings')">ไปที่ตั้งค่า</button></div>` };
  const lm = latestMonthly(), mb = D.bills.filter(b => b.kind === 'รายเดือน' && b.month === lm);
  const billed = mb.reduce((a, b) => a + +b.total, 0), got = mb.filter(b => b.status === 'ชำระแล้ว').reduce((a, b) => a + +b.paidAmount, 0);
  const review = D.bills.filter(b => b.status === 'รออนุมัติ'), over = D.bills.filter(isOverdue);
  const reps = D.repairs.filter(r => r.status !== 'เสร็จแล้ว'), newReps = reps.filter(r => r.status === 'รอดำเนินการ');
  const exp = active().filter(t => t.endDate && daysBetween(today(), t.endDate) <= 45).sort((a, b) => a.endDate.localeCompare(b.endDate));
  const cm = curMonth(), need = meterRooms(cm).length, done = meterDone(cm), issued = D.bills.some(b => b.kind === 'รายเดือน' && b.month === cm);
  const todo = [];
  if (review.length) todo.push(['🧾', 'var(--o-soft)', 'อนุมัติสลิป', 'ผู้เช่าส่งสลิปมา ' + review.map(b => b.room).slice(0, 6).join(', '), review.length, `<button class="btn sm pri">ตรวจ</button>`, 'approve']);
  const dueOk = D.bills.filter(b => b.status === 'รอชำระ' && !isOverdue(b));
  if (OWN() && dueOk.length) todo.push(['💵', 'var(--warn-soft)', 'รอรับเงิน', 'ห้อง ' + [...new Set(dueOk.map(b => b.room))].slice(0, 8).join(', '), dueOk.length, '<button class="btn sm pri">บันทึกรับเงิน</button>', 'bills']);
  if (over.length) todo.push(['⏰', 'var(--bad-soft)', 'บิลเกินกำหนด', 'ห้อง ' + [...new Set(over.map(b => b.room))].join(', '), over.length, '<button class="btn sm">ดู</button>', 'bills']);
  if (reps.length) todo.push(['🔧', 'var(--warn-soft)', newReps.length ? 'งานแจ้งซ่อมใหม่' : 'งานซ่อมยังไม่เสร็จ', reps.slice(0, 3).map(r => r.category + ' ' + r.room).join(' · '), reps.length, '<button class="btn sm">ดู</button>', 'repairs']);
  if (exp.length) todo.push(['📄', 'var(--purple-soft)', 'สัญญาใกล้หมด', exp.slice(0, 3).map(t => t.room + (daysBetween(today(), t.endDate) < 0 ? ' (หมดแล้ว)' : ' · อีก ' + daysBetween(today(), t.endDate) + ' วัน')).join(', '), exp.length, '<button class="btn sm">ดู</button>', 'tenants']);
  if (!issued) todo.push(['📊', '#eef0f2', 'จดมิเตอร์ ' + fmtMonthS(cm), done >= need && need ? 'ครบแล้ว พร้อมออกบิล' : 'จดแล้ว ' + done + '/' + need + ' ห้อง · ปกติจดสิ้นเดือน', '', `<button class="btn sm ${done >= need && need ? 'pri' : ''}">${done >= need && need ? 'ออกบิล' : 'จด'}</button>`, done >= need && need ? 'issue/' + cm : 'meters']);
  return {
    title: esc(s.apartmentName), sub: fmtDayLong(today()), right: `<button class="pill" onclick="go('profile')">✏️ ข้อมูลหอ</button>`,
    html: `<div class="kpi"><div><span class="muted">ห้องมีผู้เช่า</span><b>${occ}/${rooms.length}</b><span class="muted">ว่าง ${rooms.filter(r => r.status === 'ว่าง').length} ห้อง</span></div>
      <div class="tap" onclick="UI.billMonth='${lm || ''}';UI.billSeg='all';go('bills')"><span class="muted">เก็บเงิน ${lm ? fmtMonthS(lm) : '-'}</span><b style="color:var(--ok)">${money(got)}</b><span class="muted">จาก ${money(billed)}</span></div></div>
      <div class="card"><h4>ต้องทำ</h4>${todo.map(([i, bg, t, d, n, btn, h]) => `<div class="item tap" onclick="go('${h}')"><i class="ic" style="background:${bg}">${i}</i><div style="flex:1;min-width:0"><b>${t}</b><div class="muted small">${esc(d)}</div></div>${n !== '' ? `<b>${n}</b>` : ''}${btn}</div>`).join('') || '<div class="empty">ไม่มีงานค้าง 👍</div>'}</div>`,
  };
};

/* ---------- O2 ผังห้อง ---------- */
VIEWS.rooms = () => {
  const floors = {};
  D.rooms.forEach(r => (floors[r.floor || '-'] = floors[r.floor || '-'] || []).push(r));
  const cls = { 'มีผู้เช่า': 'background:var(--ok-soft);border-color:#bfe3cb', 'จอง': 'background:var(--warn-soft);border-color:#f1d3a7', 'ซ่อม': 'background:var(--bad-soft);border-color:#f2c4c4' };
  return {
    title: 'ผังห้อง', sub: D.rooms.length + ' ห้อง · มีผู้เช่า ' + active().length, right: `<button class="pill" onclick="roomSheet()">+ ห้อง</button>`,
    html: `<div class="row small muted" style="gap:12px;margin-bottom:8px"><span>🟩 มีผู้เช่า</span><span>⬜ ว่าง</span><span>🟧 จอง</span><span>🟥 ซ่อม</span><span><b style="color:var(--bad)">●</b> ค้างจ่าย</span><span><b style="color:var(--o)">●</b> รออนุมัติ</span></div>
    ${Object.keys(floors).sort((a, b) => a - b).map(f => `<div class="muted small" style="font-weight:700;margin:10px 0 6px">ชั้น ${esc(f)}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:7px">${floors[f].map(r => {
        const t = tenantOf(r.room), ob = openBills().filter(b => b.room === r.room && (!t || b.tenantId === t.id));
        const dot = ob.some(b => b.status === 'รออนุมัติ') ? 'var(--o)' : ob.some(isOverdue) ? 'var(--bad)' : ob.length ? 'var(--warn)' : '';
        return `<div class="tap" onclick="go('room/${encodeURIComponent(r.room)}')" style="position:relative;border:1px solid var(--line);border-radius:11px;padding:7px 8px;background:#fff;min-height:62px;${cls[r.status] || ''}">
          ${dot ? `<span style="position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:${dot}"></span>` : ''}
          <b style="font-size:16px">${esc(r.room)}</b><div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t ? esc(t.name.split(' ')[0]) : esc(r.status)}</div></div>`;
      }).join('')}</div>`).join('') || '<div class="empty">ยังไม่มีห้อง · กด “+ ห้อง” หรือสร้างหลายห้องในเมนูเพิ่มเติม › ตั้งค่า</div>'}`,
  };
};
function roomSheet(no) {
  const r = D.rooms.find(x => x.room === no) || { room: '', floor: '', type: '', rent: '', status: 'ว่าง', note: '' };
  const t = no && tenantOf(no);
  openSheet(`<h3>${no ? 'แก้ไขห้อง ' + esc(no) : 'เพิ่มห้อง'}</h3><div id="fRoom">
    <div class="g2">${no ? '' : '<label class="f">เลขห้อง<input name="room" placeholder="เช่น 101"></label>'}
      <label class="f">ชั้น<input name="floor" type="number" value="${esc(r.floor)}" placeholder="อัตโนมัติ"></label>
      <label class="f">ค่าเช่า/เดือน<input name="rent" type="number" inputmode="numeric" value="${esc(r.rent)}"></label>
      <label class="f">ประเภทห้อง<input name="type" value="${esc(r.type)}" placeholder="เช่น ห้องแอร์"></label></div>
    ${t ? '' : `<div class="muted small">สถานะห้อง</div><div class="seg" id="rst">${['ว่าง', 'จอง', 'ซ่อม'].map(s => `<button class="${s === r.status ? 'on' : ''}" onclick="segPick(this)">${s}</button>`).join('')}</div>`}
    <label class="f">หมายเหตุ<input name="note" value="${esc(r.note)}"></label></div>
    <div class="row"><button class="btn pri" style="flex:2" onclick="saveRoom(${no ? q(no) : 'null'})">บันทึก</button>${no && !t ? `<button class="btn bad" style="flex:1" onclick="delRoom(${q(no)})">ลบห้อง</button>` : ''}</div>`);
}
function segPick(b) { b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); }
function formObj(sel) { const o = {}; document.querySelectorAll(sel + ' [name]').forEach(el => o[el.name] = el.type === 'checkbox' ? el.checked : el.value.trim()); return o; }
async function saveRoom(no) {
  const o = formObj('#fRoom'); if (no) o.room = no; if (!o.room) return uiAlert('กรุณาใส่เลขห้อง');
  if (!o.floor) delete o.floor;
  const st = document.querySelector('#rst .on'); if (st) o.status = st.textContent;
  await act('saveRoom', { room: o, isNew: !no }, 'บันทึกห้องแล้ว'); closeSheet(); no ? render() : go('room/' + o.room);
}
async function delRoom(no) { if (!await uiConfirm('ลบห้อง ' + no + ' ?')) return; await act('deleteRoom', { room: no }, 'ลบห้องแล้ว'); closeSheet(); go('rooms'); }

/* ---------- O3 / O4 ห้อง ---------- */
VIEWS.room = no => {
  const r = D.rooms.find(x => x.room === no);
  if (!r) return { title: 'ไม่พบห้อง', back: 'rooms', nav: 'rooms', html: '<div class="empty">ไม่พบห้องนี้</div>' };
  const t = tenantOf(no), head = { back: 'rooms', nav: 'rooms', title: 'ห้อง ' + esc(no), sub: [r.floor ? 'ชั้น ' + r.floor : '', r.type, money(r.rent) + '/เดือน'].filter(Boolean).map(esc).join(' · '), right: `<button class="pill" onclick="roomSheet(${q(no)})">แก้ไขห้อง</button>` };
  if (!t) return Object.assign(head, { html: checkInForm(r), after: ciCalc });
  const bills = D.bills.filter(b => b.tenantId === t.id).slice(0, 6), ob = openBills().filter(b => b.tenantId === t.id);
  const dl = t.endDate ? daysBetween(today(), t.endDate) : null;
  return Object.assign(head, { html: `
    <div class="card"><div class="row"><i class="ic" style="background:var(--ok-soft);border-radius:50%">👤</i><div style="flex:1;min-width:0"><b style="font-size:17px">${esc(t.name)}</b><div class="muted small">${esc(t.phone || '-')}${t.lineId ? ' · LINE: ' + esc(t.lineId) : ''}</div></div></div>
      <div class="row" style="margin-top:10px">${t.phone ? `<button class="btn sm" style="flex:1" onclick="callPhone(${q(t.phone)})">📞 โทร</button>` : ''}${t.lineId ? `<a class="btn sm" style="flex:1" target="_blank" href="https://line.me/R/ti/p/~${encodeURIComponent(t.lineId)}">💬 LINE</a>` : ''}<button class="btn sm" style="flex:1" onclick="tenantSheet(${q(t.id)})">✏️ แก้ไข</button></div></div>
    <div class="card"><div class="line"><span class="muted">สัญญา</span><span>${fmtDate(t.startDate)} – ${fmtDate(t.endDate)} ${dl != null && dl <= 45 ? `<span class="badge ${dl < 0 ? 'b-bad' : 'b-warn'}">${dl < 0 ? 'หมดแล้ว' : 'อีก ' + dl + ' วัน'}</span>` : ''}</span></div>
      <div class="line"><span class="muted">เงินมัดจำ</span><span>${money(t.deposit)} บาท</span></div>

const mMonth = () => ROUTE[1] || curMonth();
function avgUnits(room, month, u) {
  const a = D.meters.filter(x => x.room === room && x.month < month && x[u + 'Cur'] !== '' && x[u + 'Prev'] !== '').sort((x, y) => y.month.localeCompare(x.month)).slice(0, 3).map(x => +x[u + 'Cur'] - +x[u + 'Prev']).filter(n => n >= 0);
  return a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
}
function utilCost(u, n) { const s = S(); return Math.max(n * (+s[u + 'Rate'] || 0), +s[u + 'Min'] || 0); }
// คำนวณหน่วยที่ใช้ / ค่าน้ำไฟ / เตือนเลขผิดปกติ ของแถวมิเตอร์ (ใช้ทั้งมือถือและคอม)
function mRow(row) {
  let cost = 0, warn = '', filled = 0;
  const ins = [...row.querySelectorAll('input[data-u]')];
  ins.forEach(inp => {
    const u = inp.dataset.u, p = row.dataset['p' + u], c = inp.value, cell = row.querySelector('.u-' + u);
    inp.style.borderColor = ''; inp.style.background = ''; if (cell) cell.style.color = 'var(--muted)';
    if (p === '' || p == null || c === '') { if (cell) cell.textContent = DESK() ? '—' : ''; return; }
    filled++;
    const n = +c - +p;
    if (n < 0) { warn = 'neg'; if (cell) { cell.textContent = 'ติดลบ!'; cell.style.color = 'var(--bad)'; } inp.style.borderColor = 'var(--bad)'; return; }
    cost += utilCost(u, n);
    const avg = avgUnits(row.dataset.room, mMonth(), u), high = avg > 0 && n > Math.max(avg * 2, avg + 30);
    if (high) { warn = warn || 'high'; inp.style.borderColor = 'var(--bad)'; inp.style.background = '#fff7f7'; }
    if (cell) { cell.textContent = DESK() ? n : n + ' หน่วย'; cell.style.color = high ? 'var(--bad)' : DESK() ? 'var(--ink)' : 'var(--muted)'; cell.style.fontWeight = high ? '700' : ''; }
  });
  const cc = row.querySelector('.cost'); if (cc) cc.textContent = filled ? money(cost) + ' ฿' : '—';
  const st = row.querySelector('.st'); if (st) st.innerHTML = warn === 'neg' ? '<span class="pl bad">เลขติดลบ</span>' : warn === 'high' ? '<span class="pl bad">⚠ สูงผิดปกติ</span>' : filled === ins.length && ins.length ? '<span style="color:var(--ok)">✓</span>' : '';
}
function mInput(inp) { const row = inp.closest('[data-room]'); mRow(row); mDirty[row.dataset.room] = 1; $('#mSave').textContent = 'กำลังพิมพ์…'; clearTimeout(mTimer); mTimer = setTimeout(flushMeters, 1200); }
function mKey(e, inp) {

}

VIEWS.bills = () => {
  const months = [...new Set(D.bills.map(b => b.month))].sort().reverse();
  if (!UI.billMonth || (UI.billMonth !== 'all' && !months.includes(UI.billMonth))) UI.billMonth = latestMonthly() || months[0] || curMonth();
  const seg = UI.billSeg, mm = UI.billMonth;
  const inMonth = D.bills.filter(b => mm === 'all' || b.month === mm), mb = inMonth.filter(b => b.kind === 'รายเดือน');
  const billed = mb.reduce((a, b) => a + +b.total, 0), paid = mb.filter(b => b.status === 'ชำระแล้ว'), got = paid.reduce((a, b) => a + +b.paidAmount, 0);

  let list = seg === 'todo' ? openBills().sort((a, b) => rank(a) - rank(b) || a.dueDate.localeCompare(b.dueDate)) : seg === 'paid' ? inMonth.filter(b => b.status === 'ชำระแล้ว') : inMonth;

  return {
    title: 'บิล / เงิน', sub: seg === 'todo' ? 'ทุกเดือน' : (mm === 'all' ? 'ทุกเดือน' : fmtMonth(mm)), right: `<button class="pill" onclick="newBillMenu()">+ ออกบิล</button>`,
    html: `${seg !== 'todo' ? `<select style="width:100%;margin-bottom:10px" onchange="UI.billMonth=this.value;render()"><option value="all" ${mm === 'all' ? 'selected' : ''}>ทุกเดือน</option>${months.map(m => `<option value="${m}" ${m === mm ? 'selected' : ''}>${fmtMonth(m)}</option>`).join('')}</select>` : ''}
    ${mb.length && seg !== 'todo' ? `<div class="card"><div class="row"><span class="muted">เก็บแล้ว (บิลรายเดือน)</span><span class="sp"></span><b style="color:var(--ok)">${money(got)}</b><span class="muted">/ ${money(billed)}</span></div><div class="prog"><div style="width:${billed ? got / billed * 100 : 0}%"></div></div>
      <div class="muted small">ชำระแล้ว ${paid.length}/${mb.length} ห้อง · โอน ${paid.filter(b => b.payMethod === 'โอน/พร้อมเพย์').length} · เงินสด ${paid.filter(b => b.payMethod === 'เงินสด').length}</div></div>` : ''}

    <div class="card" style="padding:2px 14px">${list.map(b => `<div class="item tap" onclick="billSheet(${q(b.id)})"><div style="flex:1;min-width:0"><b>${esc(b.room)}</b> <span class="muted">${esc((b.tenantName || '').split(' ')[0])}</span><div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(billTitle(b))}</div>${statusBadge(b)}</div>
      <div style="text-align:right"><b>${money(b.total)}</b><div style="margin-top:4px" onclick="event.stopPropagation()">${b.status === 'รออนุมัติ' ? `<button class="btn sm pri" onclick="go('approve/${b.id}')">ตรวจ</button>` : b.status === 'รอชำระ' ? `${isOverdue(b) ? `<button class="btn sm" onclick="nudge(${q(b.id)})">ทวง</button> ` : ''}<button class="btn sm ok" onclick="paySheet(${q(b.id)})">💵</button>` : `<span class="muted small">${esc(b.payMethod)}</span>`}</div></div></div>`).join('') || '<div class="empty">' + (seg === 'todo' ? 'ไม่มีบิลค้าง 👍' : 'ไม่มีบิล') + '</div>'}</div>`,
  };
};

// รูปสลิป/รูปแจ้งซ่อม: โหลดครั้งเดียวแล้วจำไว้ (ทั้งในหน้าและในแท็บนี้) เปิดซ้ำได้ทันที
function getImg(fileId) {
  if (!fileId) return Promise.reject(new Error('ไม่มีรูป'));
  if (!IMG[fileId]) {
    let cached = null; try { cached = sessionStorage.getItem('img_' + fileId); } catch (e) {}
    IMG[fileId] = cached ? Promise.resolve(cached) : api('fileImage', { fileId }, true).then(j => { try { sessionStorage.setItem('img_' + fileId, j.image); } catch (e) {} return j.image; }, e => { delete IMG[fileId]; throw e; });
  }
  return IMG[fileId];
}
async function viewFile(fileId) {

  w.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:70;display:flex;align-items:center;justify-content:center;padding:12px';
  w.innerHTML = '<div style="color:#fff">กำลังโหลดรูป…</div>'; w.onclick = () => w.remove(); document.body.appendChild(w);

}

VIEWS.home = () => DESK() && D.rooms.length ? dHome() : M.home();
function dHome() {
  const own = OWN(), rooms = D.rooms, occ = active().length;
  const lm = latestMonthly(), mb = D.bills.filter(b => b.kind === 'รายเดือน' && b.month === lm);
  const billed = sumOf(mb, 'total'), got = sumOf(mb.filter(b => b.status === 'ชำระแล้ว'), 'paidAmount'), pct = billed ? Math.round(got / billed * 100) : 0;
  const open = openBills(), over = open.filter(isOverdue), review = D.bills.filter(b => b.status === 'รออนุมัติ').sort((a, b) => (b.slipAt || '').localeCompare(a.slipAt || ''));
  const reps = D.repairs.filter(r => r.status !== 'เสร็จแล้ว'), newR = reps.filter(r => r.status === 'รอดำเนินการ'), doing = reps.filter(r => r.status === 'กำลังซ่อม');
  const paidToday = D.bills.filter(b => b.status === 'ชำระแล้ว' && b.paidDate === today());
  const free = rooms.filter(r => !tenantOf(r.room)), book = free.filter(r => r.status === 'จอง').length;
  const kpi = (l, i, v, d, bar) => `<div><div class="l">${l} <span>${i}</span></div><div class="v">${v}</div><div class="d">${d}</div>${bar != null ? `<div class="prog" style="margin:8px 0 0"><div style="width:${bar}%;background:var(--o)"></div></div>` : ''}</div>`;
  const kpis = kpi('รายรับ' + (lm ? ' ' + fmtMonthS(lm) : 'เดือนนี้'), '💰', fmtB(got), `<span class="muted">เก็บแล้ว ${pct}% ของ ${fmtB(billed)}</span>`, pct) +
    kpi('ห้องมีผู้เช่า', '🏠', occ + ' / ' + rooms.length, `<span class="muted">ว่าง ${free.length - book}${book ? ' · จอง ' + book : ''} · อัตราเข้าพัก ${rooms.length ? Math.round(occ / rooms.length * 100) : 0}%</span>`) +
    (own ? kpi('ยังไม่ได้รับเงิน', '⏳', `<span style="color:var(--warn)">${roomsOf(open).length} ห้อง</span>`, `<span style="color:${over.length ? 'var(--bad)' : 'var(--muted)'}">${fmtB(sumOf(open, 'total'))}${over.length ? ' · เกินกำหนด ' + roomsOf(over).length + ' ห้อง' : ''}</span>`)
      : kpi('รอชำระ / ค้าง', '⏳', `<span style="color:var(--warn)">${roomsOf(open.filter(b => b.status === 'รอชำระ')).length} ห้อง</span>`, over.length ? `<span style="color:var(--bad)">ค้างเกินกำหนด ${roomsOf(over).length} ห้อง · ${fmtB(sumOf(over, 'total'))}</span>` : '<span class="muted">ไม่มีค้างเกินกำหนด</span>')) +
    (own ? kpi('รับเงินวันนี้', '💵', `<span style="color:var(--ok)">${roomsOf(paidToday).length} ห้อง</span>`, `<span class="muted">โอน ${paidToday.filter(b => b.payMethod === 'โอน/พร้อมเพย์').length} · เงินสด ${paidToday.filter(b => b.payMethod === 'เงินสด').length} · ${fmtB(sumOf(paidToday, 'paidAmount'))}</span>`)
      : kpi('สลิปรออนุมัติ', '✅', `<span style="color:var(--o)">${review.length}</span>`, `<span class="muted">${review.length ? 'ล่าสุด ' + ago(review[0].slipAt) + ' · ห้อง ' + esc(review[0].room) : 'ไม่มีสลิปรอตรวจ'}</span>`)) +
    kpi('งานซ่อมค้าง', '🔧', reps.length, `<span class="muted">ใหม่ ${newR.length} · กำลังซ่อม ${doing.length}</span>`);
  // สิ่งที่ต้องทำ
  const T = [], task = (i, bg, t, d, btn) => T.push(`<div class="task"><i class="ic" style="background:${bg}">${i}</i><div style="flex:1;min-width:0"><b>${t}</b><div class="muted small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d}</div></div>${btn}</div>`);
  if (!own && review.length) task('🧾', 'var(--o-soft)', `ตรวจสลิป ${review.length} รายการ`, review.slice(0, 3).map(b => 'ห้อง ' + esc(b.room) + ' · ' + fmtB(b.total)).join(' — '), `<button class="btn sm pri" onclick="go('approve')">ตรวจเลย</button>`);
  const dueOk = open.filter(b => b.status === 'รอชำระ' && !isOverdue(b)).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  if (own && dueOk.length) task('💵', 'var(--warn-soft)', `รอรับเงิน ${roomsOf(dueOk).length} ห้อง (ยังไม่เกินกำหนด)`, roomsOf(dueOk).slice(0, 8).map(esc).join(' · ') + ' — ครบกำหนด ' + fmtDate(dueOk[0].dueDate), `<button class="btn sm pri" onclick="UI.billSeg='todo';go('bills')">บันทึกรับเงิน</button>`);
  over.slice(0, 2).forEach(b => task('⚠️', 'var(--bad-soft)', `ห้อง ${esc(b.room)} ค้างชำระ ${daysBetween(b.dueDate, today())} วัน`, `คุณ${esc((b.tenantName || '').split(' ')[0])} · ${fmtB(b.total)} · ครบกำหนด ${fmtDate(b.dueDate)}`, `<button class="btn sm" onclick="nudge(${q(b.id)})">ทวงทาง LINE</button>`));
  if (over.length > 2) task('⏰', 'var(--bad-soft)', `ค้างชำระอีก ${over.length - 2} บิล`, roomsOf(over.slice(2)).map(esc).join(', '), `<button class="btn sm" onclick="UI.billSeg='${own ? 'todo' : 'over'}';go('bills')">ดู</button>`);
  newR.slice(0, 2).forEach(r => task('🔧', 'var(--warn-soft)', `แจ้งซ่อมใหม่: ${esc(r.category)} ห้อง ${esc(r.room)}`, esc(r.detail.slice(0, 60)) + (r.source ? ' · ' + esc(r.source) : r.allowEntry === 'ได้' ? ' · อนุญาตเข้าห้องได้' : ''), `<button class="btn sm" onclick="takeJob(${q(r.id)})">รับงาน</button>`));
  if (doing.length) task('🛠', 'var(--o-soft)', `กำลังซ่อม ${doing.length} งาน`, doing.slice(0, 4).map(r => esc(r.category) + ' ' + esc(r.room)).join(' · '), `<button class="btn sm" onclick="go('repairs')">ดู</button>`);
  const exp = active().filter(t => t.endDate && daysBetween(today(), t.endDate) <= 45).sort((a, b) => a.endDate.localeCompare(b.endDate));
  if (exp.length) task('📄', 'var(--ok-soft)', `สัญญาใกล้หมด ${exp.length} ห้อง`, exp.slice(0, 3).map(t => 'ห้อง ' + esc(t.room) + ' (' + fmtDate(t.endDate) + ')').join(' · '), `<button class="btn sm" onclick="go('tenants')">ดู</button>`);
  const cm = curMonth(), need = meterRooms(cm).length, done = meterDone(cm), issued = D.bills.some(b => b.kind === 'รายเดือน' && b.month === cm);
  if (!issued && need) task('📊', '#eef0f2', 'จดมิเตอร์ ' + fmtMonthS(cm), done >= need ? 'ครบแล้ว พร้อมออกบิล' : 'จดแล้ว ' + done + '/' + need + ' ห้อง · ปกติจดสิ้นเดือน', done >= need ? `<button class="btn sm pri" onclick="go('issue/${cm}')">ออกบิล</button>` : `<button class="btn sm" onclick="go('meters')">จด</button>`);
  // กล่องล่างขวา
  let box;
  if (own) box = `<div class="card" style="margin:0"><h4>⚡ ทางลัด</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${[['💵', 'บันทึกรับเงิน', 'โอน / เงินสด / หักมัดจำ', "UI.billSeg='todo';go('bills')"], ['🔧', 'บันทึกแจ้งซ่อม', 'ผู้เช่าโทรหรือ LINE มาบอก', 'newRepairSheet()'], ['💧', 'จดมิเตอร์', 'กรอกทุกห้องในหน้าเดียว', "go('meters')"], ['📤', 'ส่งบิลทาง LINE', 'ส่งทีละห้องพร้อม QR พร้อมเพย์', 'sendAllSheet()']]
    .map(x => `<div class="tap" onclick="${x[3]}" style="border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center"><span style="font-size:24px">${x[0]}</span><div><b style="font-size:14px">${x[1]}</b><div class="muted small">${x[2]}</div></div></div>`).join('')}</div></div>`;
  else {
    const months = [...Array(6)].map((_, i) => addMonthStr(cm, i - 5)), inc = m => sumOf(D.bills.filter(b => b.status === 'ชำระแล้ว' && (b.paidDate || '').slice(0, 7) === m && b.payMethod !== 'หักเงินมัดจำ'), 'paidAmount'), max = Math.max(1, ...months.map(inc));
    box = `<div class="card" style="margin:0"><div class="row"><h4 style="margin:0;flex:1">📈 รายรับ 6 เดือน</h4><a class="small tap" onclick="go('report')">รายงานเต็ม ›</a></div>
      <div style="display:flex;align-items:flex-end;gap:14px;height:150px;border-bottom:1px solid var(--line);margin-top:10px">${months.map(m => `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center"><span class="small muted">${inc(m) ? Math.round(inc(m) / 1000) + 'k' : ''}</span><span style="display:block;height:${inc(m) / max * 82}%;min-height:${inc(m) ? 2 : 0}px;background:${m === cm ? 'var(--o)' : '#c9d7f8'};border-radius:6px 6px 0 0"></span></div>`).join('')}</div>
      <div style="display:flex;gap:14px;margin-top:5px">${months.map(m => `<div class="small muted" style="flex:1;text-align:center">${TH_MONTHS_S[+m.slice(5) - 1]}</div>`).join('')}</div></div>`;
  }
  return {
    title: 'ภาพรวม', sub: fmtDayLong(today()), wide: true,
    dright: `<button class="pill" onclick="go('meters')">💧 จดมิเตอร์</button><button class="pill pri" onclick="go('${issued ? 'bills' : done >= need && need ? 'issue/' + cm : 'meters'}')">🧾 ออกบิลเดือนนี้</button>`,
    html: `<div class="kpis">${kpis}</div>
      <div style="display:grid;grid-template-columns:1.8fr 1fr;gap:18px;align-items:start">
        <div class="card" style="margin:0"><div class="row" style="margin-bottom:10px"><h4 style="margin:0;flex:1">🏢 ผังห้องวันนี้</h4><a class="small tap" onclick="go('rooms')">ดูผังเต็ม ›</a></div>${roomGridHtml({ click: 'homeRoom' })}<div style="margin-top:10px">${LEGEND}</div></div>
        <div style="display:flex;flex-direction:column;gap:18px"><div class="card" style="margin:0"><h4>📌 สิ่งที่ต้องทำวันนี้</h4>${T.join('') || '<div class="empty">ไม่มีงานค้าง 👍</div>'}</div>${box}</div>
      </div>`,
  };
}

/* ---------- ผังห้อง + รายละเอียดด้านขวา ---------- */
VIEWS.rooms = () => DESK() ? dRooms() : M.rooms();
function dRooms() {
  const tab = UI.roomTab || 'all', st = r => roomState(r).c;
  const F = { all: null, occ: r => !!tenantOf(r.room), due: r => ['due', 'over'].includes(st(r)), free: r => !tenantOf(r.room) };
  const cnt = k => F[k] ? D.rooms.filter(F[k]).length : D.rooms.length;
  if (!UI.selRoom || !D.rooms.some(r => r.room === UI.selRoom)) UI.selRoom = (D.rooms.find(r => tenantOf(r.room)) || D.rooms[0] || {}).room;
  const floors = new Set(D.rooms.map(r => r.floor || '-')).size;
  return {
    title: 'ผังห้อง', sub: D.rooms.length + ' ห้อง · ' + floors + ' ชั้น', wide: true,
    dright: `<button class="pill" onclick="go('settings/rooms')">⚙️ จัดการห้อง</button><button class="pill" onclick="roomSheet()">＋ เพิ่มห้อง</button><button class="pill pri" onclick="checkInNext()">＋ เช็คอินผู้เช่าใหม่</button>`,
    html: `<div class="row" style="margin-bottom:10px"><div class="dtab" style="margin:0;border:0">${[['all', 'ทั้งหมด'], ['occ', 'มีผู้เช่า'], ['due', 'ค้าง / รอชำระ'], ['free', 'ว่าง']].map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" onclick="UI.roomTab='${k}';render()">${l} ${cnt(k)}</button>`).join('')}</div><span class="sp"></span>${LEGEND}</div>
      <div style="display:grid;grid-template-columns:1fr 420px;gap:18px;align-items:start">
        <div class="card" style="margin:0">${D.rooms.length ? roomGridHtml({ sel: UI.selRoom, big: true, filter: F[tab], click: 'selRoom' }) : '<div class="empty">ยังไม่มีห้อง · กด “＋ เพิ่มห้อง” หรือสร้างหลายห้องที่ ตั้งค่า › ห้องพัก</div>'}
          <div class="muted small" style="margin-top:10px">💡 คลิกห้องเพื่อดูรายละเอียดด้านขวา · ดับเบิลคลิกห้องว่างเพื่อเช็คอินผู้เช่าใหม่</div></div>
        <div class="card" style="margin:0;position:sticky;top:84px">${roomPanel(UI.selRoom)}</div></div>`,
  };
}
function checkInNext() {
  const r = D.rooms.find(x => x.room === UI.selRoom && !tenantOf(x.room)) || D.rooms.find(x => !tenantOf(x.room) && x.status === 'ว่าง') || D.rooms.find(x => !tenantOf(x.room));
  if (!r) return uiAlert('ไม่มีห้องว่าง');
  go('room/' + encodeURIComponent(r.room));
}
function roomPanel(no) {
  const r = D.rooms.find(x => x.room === no); if (!r) return '<div class="empty">เลือกห้องทางซ้าย</div>';
  const t = tenantOf(no), st = roomState(r), pc = { occ: 'ok', due: 'warn', over: 'bad', book: 'o' }[st.c] || '';
  const sub = [r.floor ? 'ชั้น ' + r.floor : '', r.type, money(r.rent) + ' ฿/เดือน'].filter(Boolean).map(esc).join(' · ');
  const head = name => `<div class="row" style="flex-wrap:nowrap;gap:12px;margin-bottom:14px"><div style="width:58px;height:58px;border-radius:14px;background:var(--o-soft);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--o);flex:none">${esc(no)}</div><div style="flex:1;min-width:0"><b style="font-size:18px">${name}</b><div class="muted small">${sub}</div></div><span class="pl ${pc}">${esc(st.l)}</span></div>`;
  if (!t) return head(r.status === 'ว่าง' ? 'ห้องว่าง' : 'ห้อง' + esc(r.status)) + (r.note ? `<p class="muted">${esc(r.note)}</p>` : '') +
    `<button class="btn ok blk lg" onclick="go('room/${encodeURIComponent(no)}')">＋ เช็คอินผู้เช่าใหม่</button><button class="btn blk" style="margin-top:8px" onclick="roomSheet(${q(no)})">✏️ แก้ไขห้อง</button>`;
  const bills = D.bills.filter(b => b.tenantId === t.id).slice(0, 3), ob = openBills().filter(b => b.tenantId === t.id), reps = D.repairs.filter(x => x.room === no && x.status !== 'เสร็จแล้ว');
  const lastM = D.meters.filter(m => m.room === no && (m.waterCur !== '' || m.elecCur !== '')).sort((a, b) => b.month.localeCompare(a.month))[0], dl = t.endDate ? daysBetween(today(), t.endDate) : null;
  return head(esc(t.name)) +
    `<div class="row" style="flex-wrap:nowrap;margin-bottom:12px">${t.phone ? `<button class="btn sm" style="flex:1" onclick="callPhone(${q(t.phone)})">📞 โทร</button>` : ''}${t.lineId ? `<a class="btn sm" style="flex:1" target="_blank" href="https://line.me/R/ti/p/~${encodeURIComponent(t.lineId)}">💬 LINE</a>` : ''}${FL().app ? `<button class="btn sm" style="flex:1" onclick="pinSheet(${q(t.id)})">🔐 รหัสผู้เช่า</button>` : ''}</div>
    <div class="line"><span class="muted">เข้าอยู่</span><span>${fmtDate(t.startDate)}</span></div>
    <div class="line"><span class="muted">สัญญาถึง</span><span>${fmtDate(t.endDate)} ${dl != null && dl <= 45 ? `<span class="badge ${dl < 0 ? 'b-bad' : 'b-warn'}">${dl < 0 ? 'หมดแล้ว' : 'อีก ' + dl + ' วัน'}</span>` : ''}</span></div>
    <div class="line"><span class="muted">เงินมัดจำ</span><span>${fmtB(t.deposit)}</span></div>
    <div class="line"><span class="muted">มิเตอร์ล่าสุด</span><span>${lastM ? 'น้ำ ' + money(lastM.waterCur !== '' ? lastM.waterCur : lastM.waterPrev) + ' · ไฟ ' + money(lastM.elecCur !== '' ? lastM.elecCur : lastM.elecPrev) : '-'}</span></div>
    <b style="display:block;margin:14px 0 2px;font-size:14px">บิลล่าสุด</b>${bills.map(b => `<div class="line tap" onclick="billSheet(${q(b.id)})"><span>${esc(billTitle(b))}</span><span>${fmtB(b.total)} ${statusPill(b)}</span></div>`).join('') || '<div class="muted small">ยังไม่มีบิล</div>'}
    <b style="display:block;margin:14px 0 2px;font-size:14px">งานซ่อม</b>${reps.map(x => `<div class="task tap" onclick="repairSheet(${q(x.id)})"><i class="ic" style="background:var(--warn-soft);width:30px;height:30px;font-size:15px">🔧</i><div style="flex:1;min-width:0">${esc(x.category)} · ${esc(x.detail.slice(0, 40))}<div class="muted small">แจ้ง ${ago(x.createdAt)}</div></div><span class="pl ${x.status === 'กำลังซ่อม' ? 'o' : 'warn'}">${esc(x.status)}</span></div>`).join('') || '<div class="muted small">ไม่มีงานค้าง</div>'}
    ${ob.length ? `<button class="btn ok blk" style="margin-top:14px" onclick="paySheet(${q(ob[ob.length - 1].id)})">💵 บันทึกรับเงิน ${fmtB(ob[ob.length - 1].total)}</button>` : ''}
    <div class="row" style="flex-wrap:nowrap;margin-top:${ob.length ? 8 : 16}px"><button class="btn" style="flex:1" onclick="go('newbill/${encodeURIComponent(no)}')">🧾 ออกบิล</button><button class="btn" style="flex:1" onclick="tenantSheet(${q(t.id)})">✏️ แก้ไข</button><button class="btn bad" style="flex:1" onclick="go('moveout/${t.id}')">🚪 ย้ายออก</button></div>`;
}

/* ---------- จดมิเตอร์ (ตาราง น้ำ+ไฟ ในแถวเดียว) ---------- */
VIEWS.meters = m => DESK() ? dMeters(m) : M.meters(m);
function dMeters(m) {
  m = m || curMonth();
  const rows = meterRooms(m), done = meterDone(m), issued = D.bills.some(b => b.kind === 'รายเดือน' && b.month === m);
  return {
    title: 'จดมิเตอร์', sub: 'รอบเดือน ' + fmtMonth(m) + ' · เลขครั้งก่อนขึ้นให้อัตโนมัติ', wide: true,
    dright: `<input type="month" value="${m}" style="font-size:14px;padding:7px 10px" onchange="flushMeters().then(()=>go('meters/'+this.value))">`,
    html: `<div class="row" style="margin-bottom:12px;gap:12px"><div class="dtab" style="margin:0;border:0"><button class="on">💧 น้ำ + ⚡ ไฟ (กรอกพร้อมกัน)</button></div><span class="sp"></span>
      <span class="pl ok" id="mSave" style="font-size:12.5px;padding:5px 12px">${issued ? 'ออกบิลเดือนนี้แล้ว' : 'บันทึกอัตโนมัติ ✓'}</span><span class="muted small" id="mCount">กรอกแล้ว ${done} / ${rows.length} ห้อง</span>
      <div class="prog" style="width:160px;margin:0"><div id="mBar" style="width:${rows.length ? done / rows.length * 100 : 0}%;background:var(--o)"></div></div>
      ${rows.length ? `<button class="btn pri" onclick="flushMeters().then(()=>go('issue/${m}'))">ถัดไป: ${issued ? 'คำนวณบิลใหม่' : 'ออกบิล ' + rows.length + ' ห้อง'} ›</button>` : ''}</div>
      <div class="card" style="padding:0;overflow:auto" id="mForm"><table class="dt"><tr><th>ห้อง</th><th>ผู้เช่า</th><th class="r">น้ำ ก่อน</th><th>น้ำ ล่าสุด</th><th class="r">ใช้ (หน่วย)</th><th class="r">ไฟ ก่อน</th><th>ไฟ ล่าสุด</th><th class="r">ใช้ (หน่วย)</th><th class="r">ค่าน้ำ+ไฟ</th><th></th></tr>
      ${rows.map(t => { const rec = D.meters.find(x => x.month === m && x.room === t.room) || {}, pv = prevReading(t.room, m);

  try { payGrab(); PAYS.img = await resizeImage(f, 1000, 0.72); PAYS.imgName = f.name || 'สลิปที่วาง.jpg'; paySheet(PAYS.id); } catch (e) { uiAlert(e.message); }
}
document.addEventListener('paste', e => {
  if (!PAYS || !$('#sbg').classList.contains('on') || !$('#pDrop')) return;
  const it = [...((e.clipboardData || {}).items || [])].find(i => i.type && i.type.startsWith('image/'));
  if (it) { e.preventDefault(); payPick(it.getAsFile()); }
});
async function payGo() {
  payGrab();
  const P = PAYS, b = billById(P.id);
  if (P.method !== 'หักเงินมัดจำ' && !(+P.amount >= +b.total)) return uiAlert('ยอดที่รับน้อยกว่ายอดบิล');
  const w = P.line ? preOpen() : null;
  let j;
  try { j = await api('recordPayment', { id: P.id, method: P.method, amount: P.amount, paidDate: P.date, note: P.note, image: P.method === 'โอน/พร้อมเพย์' ? P.img : '' }); }
  catch (e) { if (w) w.close(); return uiAlert(e.message); }
  const id = P.id; PAYS = null; closeSheet(); render();
  if (w) shareBill(id, w);
  billDone(id, 'บันทึกรับเงินแล้ว', (j.dup ? '⚠ รูปสลิปนี้' + j.dup + ' — ตรวจสอบอีกครั้ง<br>' : '') + (w ? 'เปิด LINE เพื่อส่งใบเสร็จให้ผู้เช่าแล้ว' : 'ออกใบเสร็จเรียบร้อย' + (FL().app ? ' · ผู้เช่าเห็นในแอป' : '')));
}

  if (tab === 'rooms') return { title: 'ห้องพัก', sub: 'มีทั้งหมด ' + D.rooms.length + ' ห้อง · เพิ่ม/แก้ทีละห้องได้ที่หน้าผังห้อง',
    html: `<div class="row" style="margin-bottom:14px"><button class="btn" onclick="go('rooms')">🏠 ไปหน้าผังห้อง</button><button class="btn" onclick="roomSheet()">＋ เพิ่มห้องเดียว</button></div>
      <b>สร้างห้องทีละหลายห้อง</b><p class="muted small" style="margin-top:2px">เลขห้อง = ชั้น + ลำดับ เช่น ชั้น 2 ห้องที่ 5 = 205 (ห้องที่มีแล้วจะข้าม)</p>
      <div class="g2" id="fBulk"><label class="f">ตั้งแต่ชั้น<input name="floorFrom" type="number" value="1"></label><label class="f">ถึงชั้น<input name="floorTo" type="number" value="3"></label>
      <label class="f">ห้องต่อชั้น<input name="perFloor" type="number" value="10"></label><label class="f">ค่าเช่า/เดือน<input name="rent" type="number" value="3000"></label>
      <label class="f" style="grid-column:1/-1">ประเภทห้อง<input name="type" placeholder="เช่น ห้องแอร์"></label></div><button class="btn pri" onclick="bulkRooms()">สร้างห้อง</button>` };
  if (tab === 'line') return { title: 'LINE แจ้งเตือน ' + (s.lineConfigured ? '<span class="badge b-ok">เปิดอยู่</span>' : '<span class="badge">ยังไม่ตั้ง</span>'), sub: 'แจ้งเข้ากลุ่ม LINE ทันทีเมื่อผู้เช่าส่งสลิป/แจ้งซ่อม และสรุปทุกเช้า (LINE Official Account · Messaging API)',
    html: `<div id="fLine"><label class="f">Channel access token<input name="lineToken" type="password" placeholder="${s.lineConfigured ? 'ตั้งแล้ว — เว้นว่าง = ไม่เปลี่ยน' : ''}"></label><label class="f">Group ID<input name="lineGroupId" value="${esc(s.lineGroupId)}"></label></div>
      <div class="row"><button class="btn pri" onclick="saveSettings('#fLine')">บันทึก</button><button class="btn" onclick="act('testLine',{},'ส่งข้อความทดสอบแล้ว')">ทดสอบส่ง</button></div>` };
  if (tab === 'pw') return { title: 'รหัสผ่าน', sub: 'รหัสผ่านเข้าระบบเจ้าของหอของตึกนี้', html: `<div id="fPw"><label class="f">รหัสผ่านใหม่ (อย่างน้อย 4 ตัว)<input name="adminPassword" type="password" autocomplete="new-password"></label></div><button class="btn pri" onclick="savePw()">เปลี่ยนรหัสผ่าน</button>` };
  return { title: 'การใช้งานร่วมกับผู้เช่า', sub: 'เลือกว่าผู้เช่าจะใช้ระบบด้วยหรือไม่ เปลี่ยนได้ทุกเมื่อ ข้อมูลไม่หาย', html: tmContent() };
}
function tmContent() {
  const s = S(), f = FL();
  if (!UI.tm) UI.tm = { tenantMode: f.mode, tenantApp: s.tenantApp !== '0', tenantSlip: s.tenantSlip !== '0', tenantRepair: s.tenantRepair !== '0', tenantNews: s.tenantNews !== '0', billLink: s.billLink !== '0' };
  const t = UI.tm, own = t.tenantMode === 'owner';
  const opt = (k, icon, title, lines) => `<div class="mopt ${t.tenantMode === k ? 'on' : ''}" onclick="UI.tm.tenantMode='${k}';render()"><div class="rad"></div><div style="font-size:26px">${icon}</div><b style="font-size:16px">${title}</b><div class="muted small" style="margin-top:4px;line-height:1.6">${lines}</div></div>`;
  const row = (k, title, sub, dis) => `<div class="trow ${dis ? 'dis' : ''}"><div style="flex:1"><b>${title}</b><div class="muted small">${sub}</div></div><button class="tog ${t[k] && !dis ? 'on' : ''}" onclick="UI.tm.${k}=!UI.tm.${k};render()"></button></div>`;
  return `<div class="row" style="gap:14px;align-items:stretch;flex-wrap:${DESK() ? 'nowrap' : 'wrap'}">
      ${opt('owner', '🔑', 'เจ้าของจัดการเอง', 'ผู้เช่าไม่ต้องใช้แอป เจ้าของบันทึกทุกอย่างเอง<br>• บันทึกรับเงิน (โอน / เงินสด)<br>• บันทึกแจ้งซ่อมแทนผู้เช่า<br>• ส่งบิลให้ผู้เช่าทาง LINE')}
      ${opt('shared', '👥', 'ใช้ร่วมกับผู้เช่า', 'ผู้เช่าล็อกอินด้วยเลขห้อง + รหัสผู้เช่า<br>• ดูบิล สแกนจ่าย ส่งสลิปเอง<br>• แจ้งซ่อมและติดตามสถานะเอง<br>• เจ้าของแค่กดอนุมัติสลิป')}</div>
    <div style="border:1px solid var(--line);border-radius:12px;padding:4px 16px;margin:14px 0">
      ${row('billLink', 'ส่งลิงก์บิล + QR พร้อมเพย์ทาง LINE', 'ผู้เช่าเปิดดูบิลและสแกนจ่ายได้โดยไม่ต้องล็อกอิน · ใช้ได้ทั้งสองแบบ', false)}
      ${row('tenantApp', 'ผู้เช่าเข้าแอปดูบิลและประวัติ', 'หน้าผู้เช่า (ล็อกอินด้วยเลขห้อง + รหัสผู้เช่า)', own)}
      ${row('tenantSlip', 'ผู้เช่าส่งสลิปในแอป', 'ปิดแล้วเมนู “อนุมัติสลิป” จะหายไป · เจ้าของบันทึกรับเงินเอง', own || !t.tenantApp)}
      ${row('tenantRepair', 'ผู้เช่าแจ้งซ่อมในแอป', 'เจ้าของยังบันทึกแจ้งซ่อมเองได้เสมอ', own || !t.tenantApp)}
      ${row('tenantNews', 'ประกาศถึงผู้เช่าในแอป', 'ปิดแล้วใช้ส่งประกาศทาง LINE แทนได้', own || !t.tenantApp)}</div>
    <div style="background:${own ? '#fff8eb' : '#eefaf3'};border:1px solid ${own ? '#f3d9a6' : '#bfe6cf'};border-radius:12px;padding:12px 16px;font-size:14px;line-height:1.7;margin-bottom:14px">${own
      ? '🔑 <b>เลือก: เจ้าของจัดการเอง</b> — ถ้าผู้เช่าเปิดหน้าผู้เช่า จะเห็นข้อความ “กรุณาติดต่อเจ้าของหอโดยตรง” พร้อมเบอร์โทรและ LINE<br>ข้อมูลผู้เช่า บิล และรหัสผู้เช่าเดิมยังอยู่ครบ เปิดกลับเมื่อไหร่ก็ใช้ต่อได้ทันที'
      : '👥 <b>เลือก: ใช้ร่วมกับผู้เช่า</b> — เลือกปิดเฉพาะบางฟังก์ชันได้ เช่น ให้ดูบิลได้ แต่แจ้งซ่อมต้องผ่านเจ้าของ'}</div>
    <div class="row" style="justify-content:flex-end"><button class="btn" onclick="UI.tm=null;render()">ยกเลิก</button><button class="btn pri" onclick="saveTm()">บันทึกการตั้งค่า</button></div>`;
}
async function saveTm() {
  const t = UI.tm, review = D.bills.filter(b => b.status === 'รออนุมัติ').length, b = v => v ? '1' : '0';
  if (t.tenantMode === 'owner' && review && !await uiConfirm(`ยังมีสลิปรออนุมัติ ${review} รายการ\nเปลี่ยนเป็นเจ้าของจัดการเองแล้ว ยังบันทึกรับเงินบิลเหล่านี้ได้ที่หน้าบิล`, 'เปลี่ยนโหมด')) return;
  await act('saveSettings', { settings: { tenantMode: t.tenantMode, tenantApp: b(t.tenantApp), tenantSlip: b(t.tenantSlip), tenantRepair: b(t.tenantRepair), tenantNews: b(t.tenantNews), billLink: b(t.billLink) } },
    'บันทึกแล้ว · ' + (t.tenantMode === 'owner' ? 'โหมดเจ้าของจัดการเอง' : 'ใช้ร่วมกับผู้เช่า'));
  UI.tm = null; render();
}
</script>
