<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2457c5">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>เซ็นเอกสาร</title>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=5.9.1">
<script>document.write('<script src="config.js?t=' + Date.now() + '"><\/script>')</script>
<script src="common.js?v=5.9.1"></script>
<script src="docs.js?v=5.9.1"></script>
<style>
body{background:#eef1f6}
.wrapv{max-width:820px;margin:0 auto;padding:16px 12px 40px}
.head{display:flex;gap:12px;align-items:center;margin:0 4px 14px}.head img{width:48px;height:48px;border-radius:13px}.head b{font-size:18px;display:block}
.sum{max-width:560px;margin:0 auto 14px}.sum .ln{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #eef0f4;font-size:15px}.sum .ln span{color:var(--muted)}.sum .ln b{text-align:right}
.agree{display:flex;gap:10px;align-items:flex-start;background:#eff6ff;border-left:3px solid #2457c5;border-radius:8px;padding:10px 12px;margin:12px 0;font-size:14px;line-height:1.5;cursor:pointer}.agree input{width:22px;height:22px;flex:none;margin-top:1px}
.okc{text-align:center;padding:22px 12px}.okc .ic{width:66px;height:66px;border-radius:50%;background:var(--ok-soft);color:var(--ok);font-size:36px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.stick{position:sticky;bottom:0;background:linear-gradient(transparent,#eef1f6 30%);padding:18px 0 max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;max-width:560px;margin:0 auto}
#docBox{overflow-x:hidden}.idf{max-width:560px;margin:0 auto 14px}
@media print{.noprint{display:none!important}body{background:#fff}.wrapv{padding:0;max-width:none}#docBox{overflow:visible}}
</style>
</head>
<body>
<div id="demo" class="noprint"></div>
<div class="wrapv" id="app"><p class="muted" style="text-align:center;padding:40px 0">กำลังโหลด…</p></div>
<script>
document.getElementById('demo').innerHTML = demoBanner();
const K = new URLSearchParams(location.search).get('k') || '';
const TT = {
  th: { review: 'ตรวจเอกสารก่อนเซ็น', full: 'เอกสารฉบับเต็ม', agreeC: 'ข้าพเจ้าได้อ่านและเข้าใจสัญญาเช่าทุกข้อแล้ว ยินยอมปฏิบัติตามสัญญาและระเบียบของตึก และยินยอมให้เก็บข้อมูลส่วนบุคคลเท่าที่จำเป็นตามสัญญานี้', agreeB: 'ข้าพเจ้าได้อ่านและรับทราบเงื่อนไขการจองแล้ว',
    no: 'ยังไม่ตกลง', sign: '✍️ อ่านแล้ว เซ็นชื่อยอมรับ', tick: 'กรุณาติ๊กยอมรับก่อนเซ็น', padT: 'เซ็นชื่อ', hint: 'เซ็นชื่อด้วยนิ้วในกรอบนี้', cancel: 'ยกเลิก', clear: 'ล้าง', ok: 'เซ็นเสร็จ', empty: 'กรุณาเซ็นชื่อก่อน', saving: 'กำลังบันทึก…',
    doneT: 'เซ็นเรียบร้อยแล้ว', doneD: 'บันทึกลายเซ็นของคุณแล้ว เจ้าของตึกจะได้รับแจ้ง เก็บลิงก์นี้ไว้เปิดดูเอกสารได้ตลอด', signedT: 'เอกสารนี้เซ็นแล้ว', print: '🖨 บันทึก PDF / พิมพ์', noT: 'ไม่เป็นไรครับ', noD: 'หากมีข้อสงสัย ติดต่อเจ้าของตึกได้เลย', back: '← กลับไปอ่าน',
    idT: 'ข้อมูลสำหรับเอกสาร', idc: 'เลขบัตรประชาชน / พาสปอร์ต', ida: 'ที่อยู่ตามบัตร', idNeed: 'กรุณากรอกเลขบัตรประชาชนหรือพาสปอร์ต',
    room: 'ห้อง', tenant: 'ผู้เช่า', term: 'ระยะเวลา', rent: 'ค่าเช่า', util: 'ค่าน้ำ / ค่าไฟ', dep: 'เงินประกัน', pay: 'ชำระวันทำสัญญา', perM: 'บาท/เดือน', unit: 'บาท/หน่วย', baht: 'บาท', mo: 'เดือน', booker: 'ผู้จอง', moveAt: 'วันเข้าอยู่', bdep: 'เงินจอง', left: 'คงเหลือชำระวันเข้าอยู่', call: 'โทร' },
  en: { review: 'Review before signing', full: 'Full document', agreeC: 'I have read and understood every clause of this lease, agree to follow it and the building rules, and consent to the personal data needed for this agreement being kept.', agreeB: 'I have read and accept the booking terms.',
    no: 'Not now', sign: '✍️ I agree, sign', tick: 'Please tick the box to agree first', padT: 'Sign', hint: 'Sign with your finger in this box', cancel: 'Cancel', clear: 'Clear', ok: 'Done', empty: 'Please sign first', saving: 'Saving…',
    doneT: 'Signed', doneD: 'Your signature has been saved and the owner has been notified. Keep this link to view the document anytime.', signedT: 'This document has been signed', print: '🖨 Save PDF / Print', noT: 'No problem', noD: 'If you have any questions, please contact the owner.', back: '← Back to document',
    idT: 'Your details', idc: 'ID card / Passport no.', ida: 'Address', idNeed: 'Please enter your ID card or passport number',
    room: 'Room', tenant: 'Tenant', term: 'Term', rent: 'Rent', util: 'Water / Electricity', dep: 'Deposit', pay: 'Due on signing', perM: 'THB/month', unit: 'THB/unit', baht: 'THB', mo: 'months', booker: 'Booked by', moveAt: 'Move-in', bdep: 'Booking deposit', left: 'Balance on move-in', call: 'Call' },
};
let D0 = null, T = TT.th;
const needId = () => D0.kind === 'book' ? !D0.bk.idCard : !D0.t.idCard;
const app = h => { document.getElementById('app').innerHTML = h; window.scrollTo(0, 0); };
const head = () => `<div class="head noprint"><img src="icon-192.png" alt=""><div><b>${dEsc(D0.b.name)}</b><span class="muted">${dEsc(D0.kind === 'book' ? DOCL[D0.lang].bookT : DOCL[D0.lang].lease)} · ${dEsc(D0.no || '')}</span></div></div>`;
function summary() {
  const d = D0, L = d.lang, r = [];
  if (d.kind === 'contract') { const t = d.t;
    r.push([T.tenant, t.name], [T.room, d.room.room], [T.term, dShort(t.start, L) + ' – ' + dShort(t.end, L) + (t.months ? ' (' + t.months + ' ' + T.mo + ')' : '')], [T.rent, dNum(d.room.rent) + ' ' + T.perM], [T.util, dNum(d.rates.water) + ' / ' + dNum(d.rates.elec) + ' ' + T.unit], [T.dep, dNum(t.deposit) + ' ' + T.baht], [T.pay, dNum(t.deposit + t.advance + t.key + t.card) + ' ' + T.baht]);
  } else { const k = d.bk, mi = d.moveIn, all = mi.deposit + mi.advance + mi.key + mi.card;
    r.push([T.booker, k.name], [T.room, d.room.room], [T.moveAt, dShort(k.at, L)], [T.bdep, dNum(k.deposit) + ' ' + T.baht], [T.left, dNum(Math.max(0, all - k.deposit)) + ' ' + T.baht]);
  }
  return r.map(x => `<div class="ln"><span>${dEsc(x[0])}</span><b>${dEsc(x[1])}</b></div>`).join('');
}
function drawReview() {
  app(`${head()}<div class="card sum"><h3 style="margin:0 0 6px">📄 ${T.review}</h3>${summary()}</div>
    ${needId() ? `<div class="card idf"><h4 style="margin:0 0 6px">🪪 ${T.idT}</h4><label class="f">${T.idc} *<input id="iId" autocomplete="off"></label>${D0.kind === 'contract' && !D0.t.idAddress ? `<label class="f">${T.ida}<input id="iAd"></label>` : ''}</div>` : ''}
    <h4 style="text-align:center;margin:18px 0 8px" class="noprint">${T.full} ↓</h4><div id="docBox"></div>
    <div class="stick noprint" style="flex-direction:column;gap:0"><label class="agree"><input type="checkbox" id="ag"> <span>${D0.kind === 'book' ? T.agreeB : T.agreeC}</span></label>
      <div style="display:flex;gap:8px"><button class="btn" onclick="notNow()">${T.no}</button><button class="btn pri lg" style="flex:1" onclick="doSign()">${T.sign}</button></div></div>`);
  docRender(document.getElementById('docBox'), D0);
}
function drawSigned(fresh) {
  app(`${head()}<div class="card okc noprint" style="max-width:560px;margin:0 auto 14px"><div class="ic">✓</div><h2 style="margin:0 0 6px">${fresh ? T.doneT : T.signedT}</h2>${fresh ? `<p class="muted">${T.doneD}</p>` : ''}<button class="btn pri" onclick="window.print()">${T.print}</button></div><div id="docBox"></div>`);
  docRender(document.getElementById('docBox'), D0);
}
function notNow() { app(`${head()}<div class="card okc" style="max-width:560px;margin:0 auto"><h2 style="margin:0 0 6px">${T.noT}</h2><p class="muted">${T.noD}</p>${D0.b.tel ? `<a class="btn" href="tel:${dEsc(String(D0.b.tel).replace(/[^\d+]/g, ''))}">📞 ${T.call} ${dEsc(D0.b.tel)}</a>` : ''}<p><a class="tap" onclick="drawReview()">${T.back}</a></p></div>`); }
async function doSign() {
  const iId = document.getElementById('iId'), iAd = document.getElementById('iAd'), idCard = iId ? iId.value.trim() : '', idAddress = iAd ? iAd.value.trim() : '';
  if (iId && idCard.replace(/[\s-]/g, '').length < 6) { alert(T.idNeed); iId.focus(); return; }
  if (!document.getElementById('ag').checked) { alert(T.tick); return; }
  const nm = D0.kind === 'book' ? D0.bk.name : D0.t.name;
  const img = await signPad({ title: T.padT, name: nm, hint: T.hint, cancel: T.cancel, clear: T.clear, ok: T.ok, empty: T.empty }); if (!img) return;
  app(`<p class="muted" style="text-align:center;padding:40px 0">${T.saving}</p>`);
  try { const j = await callApi('docSignPublic', { k: K, img, idCard, idAddress }); D0 = j.doc; drawSigned(true); }
  catch (e) { alert(e.message); drawReview(); }
}
(async () => {
  try { const j = await callApi('docView', { k: K }); D0 = j.doc; T = TT[D0.lang] || TT.th; if (D0.lang === 'en') document.documentElement.lang = 'en';
    document.title = D0.kind === 'book' ? DOCL[D0.lang].bookT : DOCL[D0.lang].lease;
    (D0.signs || {}).tenant ? drawSigned(false) : drawReview();
  } catch (e) { app(`<div class="card okc" style="max-width:520px;margin:30px auto"><h3>⚠️</h3><p>${dEsc(/ไม่รู้จักคำสั่ง/.test(e.message) ? 'ระบบกำลังปรับปรุง กรุณาติดต่อเจ้าของตึก' : e.message)}</p></div>`); }
})();
</script>
</body>
</html>
